<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Liebe · Gestão de Coleção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================ IDENTIDADE LIEBE ============================ */
:root{
  --rose:#b76b79; --rose-dark:#9e5462; --rose-soft:#c4838f; --rose-pale:#e9cdd2;
  --cream:#faf9f5; --blush:#f3ebe9; --beige:#d4d0be; --ink:#1a1a1a;
  --muted:#8a8378; --line:#e7e0d8; --white:#ffffff;
  --ok:#4e8a63; --ok-bg:#e9f2ec; --warn:#b8862e; --warn-bg:#f7efdd;
  --late:#9e5462; --late-bg:#f5e4e7; --na:#aaa49a;
  --shadow:0 2px 14px rgba(26,26,26,.07); --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Montserrat',-apple-system,'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5;overflow-x:clip}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose-pale);border-color:var(--rose-soft)}
a{color:var(--rose-dark)}
h1,h2,h3{font-weight:600}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:var(--beige);border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ============================ LOGIN ============================ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--blush) 0%,var(--cream) 55%);padding:24px}
.login-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:40px 36px;max-width:680px;width:100%}
.brand{font-size:34px;font-weight:300;letter-spacing:.35em;text-transform:lowercase;color:var(--ink);text-align:center}
.brand b{color:var(--rose);font-weight:300}
.brand-sub{text-align:center;color:var(--rose-dark);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:6px 0 26px}
.login-note{background:var(--blush);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:22px}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.user-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;transition:.15s;background:var(--white)}
.user-card:hover{border-color:var(--rose);transform:translateY(-2px)}
.user-card.sel{border-color:var(--rose);background:var(--blush)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;margin:0 auto 8px}
.user-card .nm{font-weight:600;font-size:13px}
.user-card .jt{font-size:11px;color:var(--muted);margin-top:2px}
.role-chip{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-top:6px;background:var(--blush);color:var(--rose-dark)}
.pin-row{display:flex;gap:10px;margin-top:22px;align-items:center;justify-content:center}
.pin-row input{max-width:140px;text-align:center;letter-spacing:.3em;font-size:16px}

/* ============================ SHELL ============================ */
.shell{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;height:100vh;z-index:40;transition:transform .2s;overflow:hidden}
.side-brand{padding:22px 20px 14px;text-align:center;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.side-brand .brand{font-size:24px}
.side-brand .brand-sub{margin:4px 0 0;font-size:10px}
.nav{padding:14px 10px;flex:1 1 auto;overflow-y:auto;min-height:0}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:13.5px;margin-bottom:3px}
.nav a:hover{background:var(--blush)}
.nav a.on{background:var(--rose);color:#fff}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.regra-ouro{margin:10px;background:var(--blush);border:1px dashed var(--rose-soft);border-radius:12px;padding:12px;font-size:11.5px;color:var(--rose-dark);text-align:center;line-height:1.6;flex-shrink:0}
.regra-ouro b{display:block;letter-spacing:.12em;font-size:10px;text-transform:uppercase;margin-bottom:4px;color:var(--rose)}
.side-user{padding:12px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.side-user .avatar{width:34px;height:34px;font-size:13px;margin:0}
.side-user .nm{font-size:12.5px;font-weight:600}
.side-user .jt{font-size:10.5px;color:var(--muted)}
.side-user button{margin-left:auto;color:var(--muted);font-size:11px;text-decoration:underline}
.main{flex:1;margin-left:232px;display:flex;flex-direction:column;min-width:0;transition:margin-left .2s}
/* estado recolhido (vale para desktop e mobile) */
body.nav-collapsed .sidebar{transform:translateX(-100%)}
body.nav-collapsed .main{margin-left:0}
body.nav-collapsed .burger{display:inline-flex;align-items:center;justify-content:center}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{font-size:11.5px;color:var(--muted)}
.topbar .sp{flex:1}
.col-hero{background:var(--rose);color:#fff;border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;box-shadow:var(--shadow)}
.col-hero h2{font-size:19px;font-weight:600;margin-bottom:4px}
.col-hero p{font-size:12.5px;opacity:.92;line-height:1.5}
.col-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.col-card{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--rose);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:7px}
.col-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,26,26,.13)}
.col-card:focus-visible{outline:2px solid var(--rose-dark);outline-offset:2px}
.col-card.on{border-left-color:var(--rose-dark);background:var(--blush)}
.col-card.mal{border-left-color:var(--late)}
.col-card.bem{border-left-color:var(--ok)}
.col-card .cc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.col-card .cc-nome{font-size:16px;font-weight:700;color:var(--ink)}
.col-card .cc-per{font-size:11.5px;color:var(--muted);line-height:1.45}
.col-card .cc-barra{height:7px;background:var(--blush);border-radius:6px;overflow:hidden;margin-top:4px}
.col-card .cc-barra .f{height:100%;background:var(--rose);border-radius:6px}
.col-card .cc-pct{font-size:11px;color:var(--muted)}
.col-card .cc-sit{font-size:12.5px;font-weight:600}
.col-card .cc-sit.mal{color:var(--late)}.col-card .cc-sit.bem{color:var(--ok)}
.col-card .cc-tags{display:flex;flex-wrap:wrap;gap:6px}
.col-card .cc-acao{margin-top:6px}
.col-card.nova{border-left-color:var(--beige);align-items:center;justify-content:center;text-align:center;min-height:190px}
.col-card.nova .cc-mais{font-size:30px;color:var(--rose);line-height:1}
.col-sel{display:flex;align-items:center;gap:6px}
.col-sel label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.col-sel select{border:1.5px solid var(--rose);border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--rose-dark);background:var(--white);max-width:200px}
.burger{display:none;font-size:20px;padding:2px 10px;border-radius:8px;color:var(--rose-dark)}
.burger:hover{background:var(--blush)}
.side-hide{position:absolute;top:14px;right:12px;width:30px;height:30px;border-radius:8px;background:var(--blush);color:var(--rose-dark);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.side-hide:hover{background:var(--rose);color:#fff}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}

/* ============================ COMPONENTES ============================ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-weight:600;font-size:12.5px;transition:.15s;white-space:nowrap}
.btn-p{background:var(--rose);color:#fff}.btn-p:hover{background:var(--rose-dark)}
.btn-o{border:1.5px solid var(--rose);color:var(--rose-dark);background:var(--white)}.btn-o:hover{background:var(--blush)}
.btn-g{border:1px solid var(--line);color:var(--muted);background:var(--white)}.btn-g:hover{border-color:var(--beige);color:var(--ink)}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:8px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:13px;letter-spacing:.04em;margin-bottom:12px;color:var(--ink)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-late{background:var(--late-bg);color:var(--late)}.b-na{background:#efece6;color:var(--na)}
.b-rose{background:var(--blush);color:var(--rose-dark)}
.b-anna{background:#ece4f3;color:#7c5e9e}.b-joice{background:var(--blush);color:var(--rose-dark)}
.b-ata{background:#e7eef0;color:#4a6b73}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.toolbar .f{display:flex;flex-direction:column;gap:3px}
.toolbar label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.toolbar select,.toolbar input{width:auto;min-width:120px;padding:7px 9px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px;background:var(--blush);border-radius:12px;line-height:1.7}
.empty b{color:var(--rose-dark)}
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--white)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr:hover td{background:#fdfcf9}

/* ============================ DASHBOARD ============================ */
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:linear-gradient(120deg,var(--rose) 0%,var(--rose-soft) 100%);color:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:20px}
.hero h2{font-size:19px;font-weight:600}
.hero .meta{font-size:12px;opacity:.92;margin-top:3px}
.hero .big{margin-left:auto;text-align:center;background:rgba(255,255,255,.16);border-radius:12px;padding:10px 22px}
.hero .big .n{font-size:26px;font-weight:700}.hero .big .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--na);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.s-ok{border-left-color:var(--ok)}.kpi.s-warn{border-left-color:var(--warn)}.kpi.s-late{border-left-color:var(--late)}
.kpi .t{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:700;margin:4px 0 2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi .m{font-size:11px;color:var(--muted);line-height:1.6}
.kpi .resp{font-size:10.5px;margin-top:6px}
.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.alert-list li{list-style:none;display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.alert-list li:last-child{border-bottom:0}
.alert-list .d{margin-left:auto;white-space:nowrap}

/* ============================ CRONOGRAMA ============================ */
.seg{display:inline-flex;border:1.5px solid var(--rose);border-radius:10px;overflow:hidden}
.seg button{padding:7px 16px;font-weight:600;color:var(--rose-dark);font-size:12px}
.seg button.on{background:var(--rose);color:#fff}
.gantt{position:relative;overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 0}
.g-row{display:flex;align-items:center;height:30px;position:relative}
.g-label{width:290px;min-width:290px;font-size:11.5px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--white);z-index:2}
.g-track{position:relative;flex:1;height:100%;border-left:1px solid var(--line)}
.g-bar{position:absolute;top:7px;height:16px;border-radius:8px;background:var(--rose-pale);overflow:hidden;min-width:6px}
.g-bar .fill{height:100%;background:var(--rose)}
.g-bar.late{background:var(--late-bg);outline:1.5px solid var(--late)}
.g-bar.done{background:var(--ok-bg)}.g-bar.done .fill{background:var(--ok)}
.g-marcos{position:absolute;left:320px;right:0;top:40px;bottom:14px;pointer-events:none;z-index:4}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--rose-dark);z-index:1}
.g-today::after{content:'hoje';position:absolute;top:-13px;left:4px;font-size:9px;color:var(--rose-dark);font-weight:700;background:var(--white);padding:0 3px}
@media(max-width:820px){.g-marcos{left:170px}}
/* --- linha de base congelada x realizado/projetado --- */
.g-row{height:38px}
.g-row.g-sel{background:var(--blush);box-shadow:inset 4px 0 0 var(--rose-dark)}
.g-row.g-dep{background:var(--cream);box-shadow:inset 4px 0 0 var(--rose-pale)}
.g-row.g-sel .g-label,.g-row.g-dep .g-label{background:transparent}
.g-label{width:320px;min-width:320px;cursor:pointer;display:flex;align-items:center;gap:5px}
.g-label .g-nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.g-flag{font-size:10px;flex-shrink:0;letter-spacing:-1px}
.g-tema{display:flex;align-items:center;height:30px;background:var(--blush);border-top:1px solid var(--line);
  font-size:11px;font-weight:700;color:var(--rose-dark);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;position:relative}
.g-tema .g-label{background:var(--blush);width:320px;min-width:320px}
.g-base{position:absolute;top:6px;height:7px;border-radius:4px;background:var(--rose-pale);min-width:4px}
.g-bar{top:16px;height:15px}
.g-bar.proj{background:var(--warn-bg);outline:1.5px solid var(--warn)}
.g-bar.proj .fill{background:var(--warn)}
.g-bar.semdata{background:transparent;outline:1.5px dashed var(--na);min-width:40px}
.g-bar.critica{box-shadow:0 0 0 2px var(--late)}
.g-desvio{position:absolute;top:18px;font-size:9.5px;font-weight:700;color:var(--late);white-space:nowrap;padding-left:5px}
.g-zoom{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.g-zoom .seg button{padding:5px 12px;font-size:11.5px}
.g-zoom .btn[disabled]{opacity:.4;cursor:default}
.g-nav{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--rose-dark)}
.g-mes.forte{border-left-color:var(--rose-pale);color:var(--rose-dark);font-weight:600}
.g-fora{position:absolute;top:16px;font-size:13px;color:var(--na);font-weight:700;line-height:15px}
.g-fora.esq{left:2px}.g-fora.dir{right:2px}
.g-regua{display:flex;position:sticky;top:0;z-index:3;background:var(--white);border-bottom:1px solid var(--line);height:26px}
.g-regua .g-label{background:var(--white);font-weight:700;color:var(--muted);font-size:10px;text-transform:uppercase}
.g-regua .g-track{border-left:1px solid var(--line)}
.g-mes{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:9.5px;color:var(--muted);padding-left:3px;white-space:nowrap}
.g-marco{position:absolute;top:0;bottom:0;width:2px;background:var(--late);z-index:1;opacity:.65}
.g-marco::after{content:attr(data-rot);position:absolute;top:-13px;left:4px;font-size:9px;color:var(--late);font-weight:700;white-space:nowrap;background:var(--white);padding:0 3px}
.g-marco.fim::after{left:auto;right:4px}
.g-grade{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
/* --- faixa "o que impacta o mostruário" --- */
.impacto{display:flex;flex-wrap:wrap;gap:12px;background:var(--white);border:1px solid var(--line);
  border-left:5px solid var(--rose);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.impacto.alerta{border-left-color:var(--late)}
.impacto .it{min-width:150px;flex:1}
.impacto .it .t{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
.impacto .it .v{font-size:19px;font-weight:700;color:var(--ink);line-height:1.25}
.impacto .it .v.mal{color:var(--late)}.impacto .it .v.bem{color:var(--ok)}
.impacto .it .m{font-size:10.5px;color:var(--muted)}
/* --- simulação no modal --- */
.passos{background:var(--cream);border-radius:10px;padding:10px 12px;margin:8px 0}
.passo{font-size:12px;line-height:1.55;padding:3px 0;color:var(--ink)}
.passo b{color:var(--rose-dark)}
.chip{display:inline-block;border:1.5px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;
  margin:0 5px 5px 0;cursor:pointer;background:var(--white);user-select:none;transition:.12s}
.chip:hover{border-color:var(--rose-soft)}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
.chip-add{display:flex;gap:7px;margin-top:6px}
.chip-add select{flex:1}
.chip .on,.chip button{background:none}
.chip button{margin-left:6px;color:inherit;opacity:.75;font-size:11px}
.chip button:hover{opacity:1}
.pred-vazio{font-size:12px;color:var(--muted);background:var(--cream);border-radius:9px;padding:8px 11px;line-height:1.5}
.pred-txt{font-size:11px;color:var(--muted);margin-top:6px}
.chip-add input{flex:1}
.foto-box{margin-top:5px}
.foto-box img{max-width:150px;max-height:150px;border-radius:10px;border:1px solid var(--line);display:block}
.foto-acts{display:flex;gap:6px;margin-top:6px}
.foto-vazia{border:1.5px dashed var(--beige);border-radius:10px;padding:16px;text-align:center;cursor:pointer;
  color:var(--muted);font-size:12px;line-height:1.5;background:var(--cream)}
.foto-vazia:hover{border-color:var(--rose-soft);color:var(--rose-dark)}
.ref-foto{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line);flex-shrink:0}
.cat-hero{background:var(--rose);color:#fff;border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.cat-hero h2{font-size:18px;font-weight:600;margin-bottom:4px}
.cat-hero p{font-size:12.5px;opacity:.92;line-height:1.5}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.cat-card .cat-ds{font-size:11.5px;color:var(--muted);margin:-4px 0 10px;line-height:1.45}
.cat-add{display:flex;gap:7px;margin-bottom:10px}
.cat-add input{flex:1}
.cat-itens{display:flex;flex-wrap:wrap;gap:6px}
.cat-chip{display:inline-flex;align-items:center;gap:5px;background:var(--blush);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px}
.cat-chip i{font-style:normal;background:var(--rose-pale);color:var(--rose-dark);border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700}
.cat-chip button{width:20px;height:20px;border-radius:50%;color:var(--muted);font-size:11px;line-height:1}
.cat-chip button:hover{background:var(--late-bg);color:var(--late)}
.promessa{border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;margin:8px 0}

/* ============================ GRID COLEÇÃO ============================ */

.cgrid .c1{left:0;min-width:34px}.cgrid .c2{left:34px;min-width:78px}.cgrid .c3{left:112px;min-width:108px;border-right:2px solid var(--line)}

.ref-act.react{color:var(--ok);border-color:#cfe0cf}.ref-act.react:hover{background:var(--ok);color:#fff}

.ev-badge{display:inline-block;margin-left:4px;font-size:8.5px;font-weight:700;background:rgba(0,0,0,.10);color:inherit;border-radius:99px;padding:0 5px;vertical-align:middle}

.man-leg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.routine{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:8px 0 14px}

<body>
<div id="app"></div>
<div id="modal" class="modal" data-action="modal-bg"></div>
<div id="tour"></div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".json" style="display:none">

<script src="data.js"></script>
<script>
'use strict';
/* =================================================================
   Liebe · Gestão de Coleção — protótipo single-file (PWR Gestão)
   data.js (seed) → STORE → SELECTORS → RENDER → ROUTER
   ================================================================= */

/* ---------------------------- helpers ---------------------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>t==null?'':String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now());
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function agoraIso(){return new Date().toISOString()}
function diffDias(a,b){const[x,y,z]=a.split('-').map(Number),[p,q,r]=b.split('-').map(Number);return Math.round((Date.UTC(p,q-1,r)-Date.UTC(x,y-1,z))/864e5)}
function addDias(d,n){if(!d)return null;const[x,y,z]=d.split('-').map(Number),t=new Date(Date.UTC(x,y-1,z));t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function fmtBR(d){if(!d)return'—';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
function fmtBRfull(d){if(!d)return'—';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function iniciais(n){return n.split(/\s+/).map(x=>x.replace(/[^\p{L}]/gu,'')).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._x);toast._x=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------------------------- store ---------------------------- */
const LS_DB='liebe_db', LS_COL='liebe_colecao', LS_SESS='liebe_session', LS_TOUR='liebe_tour_seen', LS_EXP='liebe_last_export', LS_SEEDDISMISS='liebe_seed_dismissed', LS_NAV='liebe_nav_collapsed';
let db=null;
/* ---------------------------- menu lateral (recolher/mostrar) ---------------------------- */
function isMobile(){return window.matchMedia('(max-width:860px)').matches}
let navCollapsed=(()=>{const s=localStorage.getItem(LS_NAV);return s===null?isMobile():s==='1'})();
function applyNav(){document.body.classList.toggle('nav-collapsed',navCollapsed)}
function setNav(v){navCollapsed=v;localStorage.setItem(LS_NAV,v?'1':'0');applyNav()}
let seedUpdate=false; // true quando o data.js traz uma planilha mais recente que a salva
const clone=o=>JSON.parse(JSON.stringify(o));
// Cada célula (referência × fase) pode ter VÁRIOS eventos datados (1ª, 2ª, 3ª…).
// Normaliza dados antigos/seed (1 data) para o formato com array `events`.
function normalizeEvents(d){(d.reference_phases||[]).forEach(rp=>{
  if(!Array.isArray(rp.events))rp.events=rp.completed_at?[{id:uuid(),date:rp.completed_at,notes:rp.notes||null,by:rp.completed_by||null,at:rp.created_at||rp.completed_at}]:[];
})}
// Eventos de uma célula, ordenados por data (1ª = mais antiga). Tolera rp sem `events`.
function cellEvents(rp){
  if(!rp)return[];
  const ev=Array.isArray(rp.events)?rp.events.slice():(rp.completed_at?[{date:rp.completed_at,notes:rp.notes,by:rp.completed_by}]:[]);
  return ev.filter(e=>e&&e.date).sort((a,b)=>a.date.localeCompare(b.date));
}
const MIGRATIONS=[
  // v1 → v2: cancelamento de referências com justificativa + histórico de governança
  d=>{d.reference_log=d.reference_log||[];d.references.forEach(r=>{if(!r.status)r.status='ativa';
    ['canceled_at','canceled_by','cancel_category','cancel_reason'].forEach(k=>{if(!(k in r))r[k]=null})})},
  // v2 → v3: múltiplos eventos por fase (1ª/2ª/3ª modelagem, pilotagem, prova…)
  d=>normalizeEvents(d),
  // v3 → v4: linha de base congelada + datas reais + predecessores + macro tema
  d=>{(d.macro_processes||[]).forEach(p=>{
    if(!('inicio_real' in p))p.inicio_real=null;
    if(!('fim_real' in p))p.fim_real=p.completed_at||null; // conclusão já registrada vira fim real
    if(!Array.isArray(p.predecessores))p.predecessores=[];
    if(!('macro_tema' in p))p.macro_tema=null;
    if(!('observacoes' in p))p.observacoes=null;
  });if(!d.marcos)d.marcos=(window.LIEBE_SEED&&window.LIEBE_SEED.marcos)||{}},
  // v4 → v5: dono por pessoa, promessa de recuperação e motivo do atraso
  d=>{(d.macro_processes||[]).forEach(p=>{
    if(!('responsavel_user_id' in p))p.responsavel_user_id=null;
    if(!('motivo_atraso' in p))p.motivo_atraso=null;
    if(!Array.isArray(p.promessas))p.promessas=[];
  })},
  // v5 → v6: catálogos do produto + campos descritivos da referência
  d=>{
    d.catalogos=d.catalogos||{};
    Object.keys(CATALOGO_PADRAO).forEach(k=>{
      if(!Array.isArray(d.catalogos[k])||!d.catalogos[k].length)d.catalogos[k]=[...CATALOGO_PADRAO[k]];
    });
    (d.references||[]).forEach(r=>{
      if(!('tipo_produto' in r))r.tipo_produto=null;
      if(!('tecido_principal' in r))r.tecido_principal=null;
      if(!Array.isArray(r.cores))r.cores=[];
      if(!Array.isArray(r.tamanhos))r.tamanhos=[];
      if(!('foto' in r))r.foto=null;
    });
    (d.macro_processes||[]).forEach(p=>{if(!('predecessores_editados' in p))p.predecessores_editados=false});
  },
  // v6 → v7: religa referências órfãs.
  // Antes da unificação, a grade e o cronograma da mesma planilha ficavam em
  // coleções diferentes (refs em "col-inverno_27", cronograma em
  // "col-inverno-alto-27"). Ao passar a filtrar por coleção, essas referências
  // continuaram no banco mas pararam de aparecer em qualquer tela. Aqui elas
  // voltam para a coleção da grade — nenhuma é criada nem descartada.
  d=>{
    const comCronograma=new Set((d.macro_processes||[]).map(p=>p.collection_id));
    if(!comCronograma.size)return;
    // a coleção da grade é a dona dos prazos de fase; senão, a única com cronograma
    const porPrazo=(d.phase_deadlines||[]).map(x=>x.collection_id).find(id=>comCronograma.has(id));
    const alvo=porPrazo||(comCronograma.size===1?[...comCronograma][0]:null);
    if(!alvo)return; // ambíguo: não adivinha, deixa como está
    const nomePorId={};(d.collections||[]).forEach(c=>nomePorId[c.id]=c.name);
    (d.references||[]).forEach(r=>{
      if(comCronograma.has(r.collection_id))return;
      // preserva o rótulo original da peça antes de realocar
      if(!r.collection_name)r.collection_name=nomePorId[r.collection_id]||null;
      r.collection_id=alvo;
    });
    (d.reference_phases||[]).forEach(rp=>{if(rp.collection_id&&!comCronograma.has(rp.collection_id))rp.collection_id=alvo});
  },
]; // futuras migrações de schema (mesmo padrão no Supabase)
function migrate(d){let v=d.schema_version||1;while(v<MIGRATIONS.length+1){MIGRATIONS[v-1](d);v++;d.schema_version=v}return d}

// Aplica a nova planilha: substitui o catálogo (vindo do Excel) e PRESERVA o
// trabalho do dia a dia (tarefas, atas, cobranças, indicadores lançados).
function applyNewSeed(){
  const seed=window.LIEBE_SEED;

  const refsManuais=guardarRefsManuais();

  ['users','collections','phases','phase_deadlines','macro_processes','references','reference_phases'].forEach(k=>db[k]=clone(seed[k]));
  db.catalogos=catalogosAtuais;

// Mantém cancelamentos "grudados" mesmo quando uma nova planilha substitui as referências:
// para cada código, se a última ação no histórico for 'cancelamento', re-aplica o status.
// O início/fim real dos processos é digitado na plataforma, não vem da planilha.
// Guardamos antes da troca de catálogo e recolamos depois, casando por seq.
// Referências criadas aqui (id 'ref-m-…') não existem na planilha: se o catálogo
// fosse simplesmente sobrescrito, o cadastro manual do time sumiria sem aviso.
// Tipo, tecido, cores, tamanhos e foto são digitados aqui — a planilha não os traz.
// Sem isso, uma atualização de planilha apagaria a descrição de todas as peças.
function guardarDescritivosRef(){
  const m={};
  (db.references||[]).forEach(r=>{
    if(r.tipo_produto||r.tecido_principal||r.foto||(r.cores||[]).length||(r.tamanhos||[]).length)
      m[r.collection_id+'|'+r.code]={tipo_produto:r.tipo_produto||null,tecido_principal:r.tecido_principal||null,
        cores:r.cores||[],tamanhos:r.tamanhos||[],foto:r.foto||null};
  });
  return m;
}
function reaplicarDescritivos(m){
  if(!m)return;
  db.references.forEach(r=>{const d=m[r.collection_id+'|'+r.code];if(!d)return;
    r.tipo_produto=r.tipo_produto||d.tipo_produto;
    r.tecido_principal=r.tecido_principal||d.tecido_principal;
    if(!(r.cores||[]).length)r.cores=d.cores;
    if(!(r.tamanhos||[]).length)r.tamanhos=d.tamanhos;
    r.foto=r.foto||d.foto;
  });
}
function guardarRefsManuais(){
  const refs=(db.references||[]).filter(r=>String(r.id).startsWith('ref-m-'));
  const ids=new Set(refs.map(r=>r.id));
  // as fases dessas referências também só existem aqui: sem elas o histórico some
  return{refs:refs.map(clone),fases:(db.reference_phases||[]).filter(rp=>ids.has(rp.reference_id)).map(clone)};
}
function reaplicarRefsManuais(g){
  if(!g||!g.refs||!g.refs.length)return;
  const voltaram=new Set();
  g.refs.forEach(r=>{
    const jaVeio=db.references.some(x=>x.code===r.code&&x.collection_id===r.collection_id);
    if(!jaVeio){db.references.push(r);voltaram.add(r.id)} // se a planilha passou a trazer o código, ela manda
  });
  (g.fases||[]).forEach(rp=>{if(voltaram.has(rp.reference_id))db.reference_phases.push(rp)});
}
function guardarRealizado(){
  const m={};(db.macro_processes||[]).forEach(p=>{
    if(p.inicio_real||p.fim_real||p.responsavel_user_id||p.motivo_atraso||(p.promessas||[]).length||p.predecessores_editados)
      m[p.collection_id+'|'+p.seq]={inicio_real:p.inicio_real||null,fim_real:p.fim_real||null,completed_at:p.completed_at||null,
        percent_complete:p.percent_complete||0,responsavel_user_id:p.responsavel_user_id||null,
        motivo_atraso:p.motivo_atraso||null,promessas:p.promessas||[],
        predecessores:p.predecessores_editados?[...(p.predecessores||[])]:null}});
  return m;
}
function reaplicarRealizado(m){
  if(!m)return;
  db.macro_processes.forEach(p=>{const r=m[p.collection_id+'|'+p.seq];if(!r)return;
    // a planilha pode ter avançado mais que a tela: fica a data mais recente conhecida
    p.inicio_real=p.inicio_real||r.inicio_real;
    if(r.fim_real&&(!p.fim_real||r.fim_real>p.fim_real))p.fim_real=r.fim_real;
    if(r.completed_at&&(!p.completed_at||r.completed_at>p.completed_at))p.completed_at=r.completed_at;
    if((r.percent_complete||0)>(p.percent_complete||0))p.percent_complete=r.percent_complete;
    // dono, motivo e promessas só existem na plataforma — a planilha nunca os traz
    if(r.responsavel_user_id)p.responsavel_user_id=r.responsavel_user_id;
    if(r.motivo_atraso)p.motivo_atraso=r.motivo_atraso;
    if((r.promessas||[]).length)p.promessas=r.promessas;
    // dependências ajustadas na plataforma vencem as da planilha: foi decisão do time
    if(r.predecessores){p.predecessores=[...r.predecessores];p.predecessores_editados=true}
  });
}

/* -------- cronograma: linha de base, projeção, margem e cadeia de impacto --------
   Regra definida com o cliente (reunião de 02/09, Anna + Cairo):
   etapa SEM predecessor RODA EM PARALELO — fica ancorada na própria data e nunca
   é empurrada por outra; só quem tem predecessor herda atraso. Contagem em dias
   corridos, que é como a planilha conta ("Prazo em Dias").
   start_date/end_date = linha de base CONGELADA, nunca reescrita pela tela. */
/* Cada coleção é um cronograma próprio e independente: etapas, marcos, donos,
   promessas e caminho crítico vivem dentro dela. Nada atravessa de uma para outra. */
function colecoesComCronograma(){
  const ids=new Set((db.macro_processes||[]).map(p=>p.collection_id));
  return db.collections.filter(c=>ids.has(c.id));
}
function colecaoAtivaId(){
  let id=null;try{id=localStorage.getItem(LS_COL)}catch(e){}
  const cs=colecoesComCronograma();
  if(id&&cs.some(c=>c.id===id))return id;
  return cs.length?cs[0].id:(db.collections[0]||{}).id;
}
// Contexto temporário: roda o motor sobre outra coleção sem mudar a que está em uso.
// É o que permite a tela inicial mostrar o retrato real de cada uma.
let _colCtx=null;
function comColecao(id,fn){const ant=_colCtx;_colCtx=id;try{return fn()}finally{_colCtx=ant}}
function colecaoCtxId(){return _colCtx||colecaoAtivaId()}
function colecaoAtiva(){const id=colecaoCtxId();return db.collections.find(c=>c.id===id)||db.collections[0]}
function setColecaoAtiva(id){try{localStorage.setItem(LS_COL,id)}catch(e){}
  ST.cronograma.sel=null;ST.cronograma.foco=null}
// Processos da coleção ativa — base de TODO o cálculo do cronograma.
function procsCol(){const id=colecaoCtxId();return (db.macro_processes||[]).filter(p=>p.collection_id===id)}
// Referências e prazos de fase também pertencem a uma coleção.
function refsCol(){const id=colecaoCtxId();return (db.references||[]).filter(r=>r.collection_id===id)}
function deadlinesCol(){const id=colecaoCtxId();return (db.phase_deadlines||[]).filter(d=>d.collection_id===id)}
// Tarefas e rituais nascem vinculados à coleção em que foram criados. Os que vieram
// de antes (sem coleção) continuam aparecendo em todas — não somem do radar de ninguém.
function daColecao(x){const id=colecaoCtxId();return !x.collection_id||x.collection_id===id}
function tasksCol(){return (db.tasks||[]).filter(daColecao)}
function ritualsCol(){return (db.rituals||[]).filter(daColecao)}
function marcosDb(){const c=colecaoAtiva();return (c&&c.marcos)||db.marcos||(window.LIEBE_SEED&&window.LIEBE_SEED.marcos)||{}}
function seqPcp(){return marcosDb().liberacao_pcp_seq||null}
function dataEntrega(){return marcosDb().entrega_mostruario||null}
function procsOrdenados(){return [...procsCol()].sort((a,b)=>a.seq-b.seq)}
function predsDe(p){return Array.isArray(p.predecessores)?p.predecessores:[]}
function duracaoProc(p){return(p.start_date&&p.end_date)?Math.max(diffDias(p.start_date,p.end_date),0):null}
function procPorSeq(){const m={};procsCol().forEach(p=>m[p.seq]=p);return m}
function sucessoresPorSeq(){const m={};procsCol().forEach(p=>predsDe(p).forEach(s=>{(m[s]=m[s]||[]).push(p.seq)}));return m}
function rodaEmParalelo(p){return predsDe(p).length===0}
// Tudo que vem depois de uma etapa, andando pelos sucessores.
function cadeiaAFrente(seq,suc){const out={},fila=[...(suc[seq]||[])];
  while(fila.length){const x=fila.shift();if(out[x])continue;out[x]=true;(suc[x]||[]).forEach(y=>fila.push(y))}
  return out}
// Dependência circular trava a projeção (A espera B que espera A). Antes de aceitar
// um predecessor novo, conferimos se ele já está na cadeia DEPOIS desta etapa.
function criariaCiclo(seq,novoPred){
  if(seq===novoPred)return true;
  return !!cadeiaAFrente(seq,sucessoresPorSeq())[novoPred];
}
// Formato da coluna "Predecessor" da planilha: 1 → "1"; [6,7,15] → "6, 7 e 15".
function textoPredecessores(lista){
  const l=[...lista].sort((a,b)=>a-b);
  if(!l.length)return'';
  if(l.length===1)return String(l[0]);
  return l.slice(0,-1).join(', ')+' e '+l[l.length-1];
}

// Projeção de cada processo. `extra` = {seq: diasDeAtrasoSimulado} para a simulação.
// Devolve {seq:{ini,fim,origem:'real'|'projetado'|'indefinido',incompleto}}
function projetarCronograma(hoje,extra){
  const bySeq=procPorSeq(),memo={},emCurso={};
  function calc(seq){
    if(memo[seq])return memo[seq];
    const p=bySeq[seq];
    if(!p||emCurso[seq])return{ini:null,fim:null,origem:'indefinido',incompleto:true}; // inexistente ou ciclo
    emCurso[seq]=1;
    const bump=(extra&&extra[seq])||0,fimReal=p.fim_real||p.completed_at;
    let r;
    if(fimReal){
      r={ini:p.inicio_real||p.start_date,fim:addDias(fimReal,bump),origem:'real',incompleto:false};
    }else{
      const dur=duracaoProc(p);
      if(dur===null){
        r={ini:null,fim:null,origem:'indefinido',incompleto:true};
      }else{
        let ini,incompleto=false;
        if(rodaEmParalelo(p)){
          ini=p.inicio_real||p.start_date;              // trilha paralela: ancorada, nunca empurrada
        }else{
          const pr=predsDe(p).map(calc);
          incompleto=pr.some(x=>!x.fim);                // predecessor sem data → projeção incerta
          const fins=pr.map(x=>x.fim).filter(Boolean);
          ini=fins.length?addDias(fins.reduce((a,b)=>a>b?a:b),1):p.start_date;
          if(p.inicio_real)ini=p.inicio_real;
          else if(p.start_date&&ini<p.start_date)ini=p.start_date; // piso: não antecipa a linha de base
        }
        let fim=addDias(ini,dur);
        if(fim<hoje)fim=hoje;                           // não concluída não termina no passado
        fim=addDias(fim,bump);                          // atraso simulado entra DEPOIS do piso de hoje,
                                                        // senão o piso engoliria a simulação
        r={ini,fim,origem:'projetado',incompleto};
      }
    }
    emCurso[seq]=0;return memo[seq]=r;
  }
  const out={};procsCol().forEach(p=>out[p.seq]=calc(p.seq));return out;
}

// Quem alcança um processo-marco andando pelos sucessores.
function alcancam(marcoSeq){
  const suc=sucessoresPorSeq(),ok={},memo={};
  function vai(seq){
    if(seq===marcoSeq)return true;
    if(memo[seq]!==undefined)return memo[seq];
    memo[seq]=false; // corta ciclo
    return memo[seq]=(suc[seq]||[]).some(vai);
  }
  procsCol().forEach(p=>{if(vai(p.seq))ok[p.seq]=true});
  return ok;
}

// Margem de manobra (folga) em dias. alvo={seq} para um processo-marco,
// ou {data} para a entrega (aí as pontas soltas da rede é que respondem pela data).
// Positivo = pode atrasar tanto sem mexer no marco. Negativo = já estourou.
function margemCronograma(hoje,alvo){
  const proj=projetarCronograma(hoje),suc=sucessoresPorSeq(),bySeq=procPorSeq();
  const naCadeia=alvo.seq?alcancam(alvo.seq):null;
  const lf={},memo={};
  function tardio(seq){ // late finish
    if(memo[seq]!==undefined)return memo[seq];
    memo[seq]=null;
    const p=bySeq[seq];if(!p)return null;
    if(alvo.seq&&seq===alvo.seq)return memo[seq]=(p.end_date||proj[seq].fim);
    const ss=(suc[seq]||[]).filter(x=>!naCadeia||naCadeia[x]);
    let r=null;
    if(!ss.length){
      r=alvo.data&&(!naCadeia||naCadeia[seq])?alvo.data:null; // ponta solta responde pela entrega
    }else{
      ss.forEach(x=>{const lfx=tardio(x),dx=duracaoProc(bySeq[x]);
        if(lfx==null||dx==null)return;
        const ls=addDias(lfx,-dx-1); // início tardio do sucessor, -1 do encadeamento
        if(r==null||ls<r)r=ls});
    }
    return memo[seq]=r;
  }
  const out={};
  procsCol().forEach(p=>{
    const dentro=naCadeia?!!naCadeia[p.seq]:true;
    const l=dentro?tardio(p.seq):null,f=proj[p.seq].fim;
    // dentro da cadeia mas sem margem calculável = alguma etapa do caminho está sem data
    out[p.seq]=(l&&f)?{dias:diffDias(f,l),dentro:true,bloqueado:false,incompleto:proj[p.seq].incompleto}
                     :{dias:null,dentro:dentro,bloqueado:dentro,incompleto:proj[p.seq].incompleto};
    lf[p.seq]=l;
  });
  return out;
}

// "Se esta etapa atrasar N dias, o que isso empurra e até onde chega?"
// A pergunta literal do Cairo na reunião.
function simularAtraso(seq,dias,hoje){
  const base=projetarCronograma(hoje),sim=projetarCronograma(hoje,{[seq]:dias}),bySeq=procPorSeq();
  const alvo=bySeq[seq],jaConcluida=!!(alvo&&(alvo.fim_real||alvo.completed_at));
  const afetados=[];
  procsCol().forEach(p=>{
    if(p.seq===seq)return;
    const a=base[p.seq].fim,b=sim[p.seq].fim;
    if(a&&b){const d=diffDias(a,b);if(d>0)afetados.push({seq:p.seq,name:p.name,macro_tema:p.macro_tema,dias:d,de:a,para:b})}
  });
  afetados.sort((x,y)=>y.dias-x.dias||x.seq-y.seq);
  const pcp=seqPcp();
  // Por que nada se moveu? São três motivos bem diferentes, e a tela precisa dizer qual.
  const suc=sucessoresPorSeq(),aFrente=cadeiaAFrente(seq,suc);
  const temSucessores=(suc[seq]||[]).length>0;
  const semDataNaCadeia=Object.keys(aFrente).map(Number)
    .filter(n=>base[n]&&base[n].origem==='indefinido')
    .map(n=>{const q=bySeq[n];return{seq:n,name:q?q.name:'—'}});
  return{
    seq,dias,afetados,jaConcluida,temSucessores,semDataNaCadeia,
    // etapa já concluída não comporta simulação: o que aconteceu, aconteceu
    empurra:!jaConcluida&&afetados.length>0,
    pcp:(pcp&&base[pcp]&&sim[pcp]&&base[pcp].fim&&sim[pcp].fim)?diffDias(base[pcp].fim,sim[pcp].fim):0,
    temas:[...new Set(afetados.map(a=>a.macro_tema).filter(Boolean))]
  };
}

// Ordem de leitura dos macro temas no painel (do começo ao fim da coleção).
const ORDEM_TEMAS=['Estilo','Desenvolvimento','Mostruário','Plano de Produção/Mostruário','Catálogo'];
function ordemTema(t){const i=ORDEM_TEMAS.indexOf(t||'');return i<0?ORDEM_TEMAS.length:i}

// Panorama para a faixa de topo: a resposta de 5 segundos que a diretoria pede.
function panoramaCronograma(hoje){
  const proj=projetarCronograma(hoje),mg=margemCronograma(hoje,{seq:seqPcp()});
  const ps=procsOrdenados();
  let atrasadas=0,semMargem=0,indefinidas=0,fimGeral=null,empurram=0;
  const limite=addDias(hoje,7),vencendo=[];
  ps.forEach(p=>{
    const st=situacaoProc(p,proj,mg);
    if(st.origem==='indefinido'){indefinidas++;return}
    if(st.desvio>0)atrasadas++;
    // margem só conta para o que ainda pode atrasar: etapa concluída não perde margem
    if(st.critico&&!(p.fim_real||p.completed_at))semMargem++;
    if(st.fim&&(!fimGeral||st.fim>fimGeral))fimGeral=st.fim;
    const emAberto=!(p.fim_real||p.completed_at);
    if(emAberto&&simularAtraso(p.seq,1,hoje).empurra)empurram++;
    // antecipação: o que ainda não terminou e vence nos próximos 7 dias
    if(emAberto&&p.end_date&&p.end_date>=hoje&&p.end_date<=limite)vencendo.push({p,dias:diffDias(hoje,p.end_date)});
  });
  vencendo.sort((a,b)=>a.dias-b.dias);
  const sp=seqPcp(),pp=sp?procsCol().find(x=>x.seq===sp):null;
  return{proj,mg,atrasadas,semMargem,indefinidas,empurram,vencendo,
    fimGeral,entrega:dataEntrega(),
    pcp:pp?{p:pp,congelado:pp.end_date,previsto:proj[sp].fim,
            desvio:(pp.end_date&&proj[sp].fim)?diffDias(pp.end_date,proj[sp].fim):null}:null};
}

/* -------- governança do cronograma: dono, promessa de recuperação e motivo --------
   Tudo aqui nasceu da reunião de 02/09: atraso descoberto tarde, sem dono e sem
   data nova combinada. "Vamos correr" não é plano; "a Fulana entrega quinta" é. */
const MOTIVOS_ATRASO={
  fornecedor:'Material ou fornecedor atrasou',
  decisao:'Faltou decisão ou aprovação',
  gente:'Faltou gente ou tempo da equipe',
  retrabalho:'Retrabalho ou mudança de pedido',
  outra_area:'Outra área não entregou',
  outro:'Outro motivo',
};
// Promessas são append-only (histórico); o desfecho é DERIVADO, nunca gravado.
function promessas(p){return Array.isArray(p.promessas)?p.promessas:[]}
function promessaAtual(p){const ps=promessas(p);return ps.length?ps[ps.length-1]:null}
function situacaoPromessa(p,hoje){
  const pr=promessaAtual(p);
  if(!pr)return null;
  const fim=p.fim_real||p.completed_at;
  if(fim)return{data:pr.data,k:fim<=pr.data?'cumprida':'quebrada',dias:diffDias(pr.data,fim),por:pr.feita_por};
  if(pr.data<hoje)return{data:pr.data,k:'quebrada',dias:diffDias(pr.data,hoje),por:pr.feita_por};
  return{data:pr.data,k:'aberta',dias:diffDias(hoje,pr.data),por:pr.feita_por};
}
// "O que foi prometido está sendo cumprido?" — o indicador que muda comportamento.
function placarPromessas(hoje){
  let cumpridas=0,quebradas=0,abertas=0;
  procsCol().forEach(p=>{const s=situacaoPromessa(p,hoje);if(!s)return;
    if(s.k==='cumprida')cumpridas++;else if(s.k==='quebrada')quebradas++;else abertas++});
  const fechadas=cumpridas+quebradas;
  return{cumpridas,quebradas,abertas,fechadas,pct:fechadas?Math.round(cumpridas/fechadas*100):null};
}
// Onde o tempo foi embora nesta coleção.
function motivosAgregados(){
  const m={};
  procsCol().forEach(p=>{if(p.motivo_atraso)m[p.motivo_atraso]=(m[p.motivo_atraso]||0)+1});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
// "Quanto da coleção depende de cada tecido?" — renda importada foi o que
// derrubou o mostruário, então isso precisa ser visível, não descoberto depois.
function tecidosAgregados(){
  const refs=refsCol().filter(r=>r.status!=='cancelada');
  const total=refs.length;
  const m={};
  refs.forEach(r=>{const t=r.tecido_principal||'— não informado —';m[t]=(m[t]||0)+1});
  const linhas=Object.entries(m).sort((a,b)=>b[1]-a[1])
    .map(([nome,n])=>({nome,n,pct:total?Math.round(n/total*100):0}));
  const semInfo=m['— não informado —']||0;
  return{total,linhas,semInfo};
}
function donoProc(p){return p.responsavel_user_id?ix.userById[p.responsavel_user_id]:null}
function nomeDono(p){const u=donoProc(p);return u?u.name:(p.owner_team||null)}

/* Classificação para o filtro "precisa de atenção" — a fila de trabalho da reunião. */
function atencaoProc(p,hoje,st){
  const fim=p.fim_real||p.completed_at;
  if(fim)return null;
  if(p.end_date&&p.end_date<hoje)return{k:'atrasada',rot:'em atraso'};
  if(st&&st.critico)return{k:'sem_margem',rot:'sem margem'};
  if(p.end_date){const f=diffDias(hoje,p.end_date);if(f>=0&&f<=7)return{k:'vencendo',rot:'vence em '+f+'d'}}
  if(st&&st.origem==='indefinido')return{k:'sem_data',rot:'sem data'};
  return null;
}

/* Pauta do ritual semanal, gerada do cronograma: o que cobrar, na ordem certa. */
function pautaDoCronograma(hoje){
  const pan=panoramaCronograma(hoje),L=[];
  const linha=p=>{const d=nomeDono(p);return `  - ${p.seq}. ${p.name}${d?' ('+d+')':''}`};
  const atrasadas=[],vencendo=[],semMargem=[],semData=[];
  procsOrdenados().forEach(p=>{
    const st=situacaoProc(p,pan.proj,pan.mg),a=atencaoProc(p,hoje,st);
    if(!a)return;
    if(a.k==='atrasada')atrasadas.push(p);
    else if(a.k==='vencendo')vencendo.push(p);
    else if(a.k==='sem_margem')semMargem.push(p);
    else if(a.k==='sem_data')semData.push(p);
  });
  L.push('PAUTA — RITUAL SEMANAL DE CRONOGRAMA · '+fmtBRfull(hoje));
  L.push('');
  if(pan.pcp)L.push(`Liberação para o PCP: congelado ${fmtBR(pan.pcp.congelado)} · previsto ${fmtBR(pan.pcp.previsto)}`+
    (pan.pcp.desvio>0?` — ${pan.pcp.desvio} dias de atraso`:' — no prazo'));
  const pl=placarPromessas(hoje);
  if(pl.fechadas)L.push(`Promessas de recuperação: ${pl.cumpridas} cumpridas de ${pl.fechadas}${pl.abertas?` (${pl.abertas} em aberto)`:''}`);
  L.push('');
  const bloco=(tit,arr,inst)=>{if(!arr.length)return;
    L.push(`${tit} (${arr.length}) — ${inst}`);arr.forEach(p=>L.push(linha(p)));L.push('')};
  bloco('1) EM ATRASO',atrasadas,'para cada uma: o que falta, quem faz e em que data');
  bloco('2) VENCE NOS PRÓXIMOS 7 DIAS',vencendo,'confirmar que vai entregar; é aqui que dá para evitar o atraso');
  bloco('3) SEM MARGEM DE MANOBRA',semMargem,'se atrasar, empurra a liberação para o PCP no mesmo dia');
  bloco('4) SEM DATA NA PLANILHA',semData,'definir data — sem ela não dá para prever o que vem depois');
  if(!atrasadas.length&&!vencendo.length&&!semMargem.length&&!semData.length)L.push('Nenhum ponto de atenção no cronograma nesta semana.');
  L.push('Decisões e encaminhamentos → registrar na ata e abrir tarefa com dono e prazo.');
  return L.join('\n');
}

// A partir de quantos dias de atraso esta etapa começa a empurrar alguém.
// É a folga real dela contra a próxima da fila — normalmente a etapa não é a que
// segura o sucessor, e por isso um atraso pequeno não move nada.
function limiarImpacto(seq,hoje,max){
  max=max||180;
  if(!simularAtraso(seq,max,hoje).afetados.length)return null;
  let lo=1,hi=max;
  while(lo<hi){const m=Math.floor((lo+hi)/2);
    if(simularAtraso(seq,m,hoje).afetados.length)hi=m;else lo=m+1}
  return lo;
}
// Situação de um processo somando linha de base, realizado e projeção.
function situacaoProc(p,proj,margem){
  const pr=proj[p.seq]||{},mg=(margem&&margem[p.seq])||{};
  const desvio=(pr.fim&&p.end_date)?diffDias(p.end_date,pr.fim):null;
  return{
    ini:pr.ini,fim:pr.fim,origem:pr.origem,incompleto:pr.incompleto,
    desvio,                                   // >0 = terminou/termina depois do congelado
    paralelo:rodaEmParalelo(p),
    margem:mg.dias,dentroDaCadeia:mg.dentro,margemBloqueada:!!mg.bloqueado,
    critico:mg.dias!=null&&mg.dias<=0&&mg.dentro
  };
}
function statusProcesso(p,hoje){
  if(p.completed_at)return{k:'done',late:p.end_date&&p.completed_at>p.end_date}
  if(p.end_date&&p.end_date<hoje)return{k:'late',days:diffDias(p.end_date,hoje)}
  return{k:'ok'}
}
function statusCelula(ref,ph,hoje){
  if(!phaseApplies(ref,ph))return{k:'na'};
  const rp=ix.rpByKey[ref.id+'|'+ph.id], dl=ix.dlByPhase[ph.id];
  const evs=cellEvents(rp), ultimo=evs.length?evs[evs.length-1].date:null;
  if(ultimo)return{k:(dl&&ultimo>dl)?'donelate':'done',date:ultimo,n:evs.length,rp};
  if(dl&&dl<hoje)return{k:'late',days:diffDias(dl,hoje)};
  return{k:'pend'};
}
function contadoresFase(refs,hoje){
  const out={};
  db.phases.forEach(ph=>{
    const c={done:0,late:0,pend:0,total:0};
    refs.forEach(r=>{if(r.status==='cancelada')return;const s=statusCelula(r,ph,hoje);if(s.k==='na')return;c.total++;
      if(s.k==='done'||s.k==='donelate')c.done++;else if(s.k==='late')c.late++;else c.pend++});
    out[ph.id]=c;
  });
  return out;
}
/* ---------------------------- KPIs ---------------------------- */
function kpis(){
  const hoje=hojeStr(),mes=hoje.slice(0,7);
  // Cumprimento do cronograma = REALIZADO vs PREVISTO (avanço esperado por hoje).
  // Ponderado pela duração de cada processo (estilo "valor agregado").
  let sumDur=0,sumPrev=0,sumReal=0;
  procsCol().forEach(p=>{
    if(!p.start_date||!p.end_date)return;
    const dur=Math.max(diffDias(p.start_date,p.end_date),1);
    const esperado=Math.min(1,Math.max(0,diffDias(p.start_date,hoje)/dur)); // 0..1 por hoje
    sumDur+=dur; sumPrev+=esperado*dur; sumReal+=((p.percent_complete||0)/100)*dur;
  });
  const previsto=sumDur?sumPrev/sumDur*100:0, realizado=sumDur?sumReal/sumDur*100:0;
  const macro=sumDur?{v:previsto>0?Math.round(realizado/previsto*100):(realizado>0?100:0),previsto:Math.round(previsto),realizado:Math.round(realizado)}:null;
  // referências válidas para indicadores: exclui canceladas
  const refsAtivas=refsCol().filter(r=>r.status!=='cancelada');
  // Tempo de Pilotagem: fim do DESENHO → fim da PILOTAGEM (em dias), global + por referência
  const phDes=db.phases.find(p=>p.key==='desenho'),phPil=db.phases.find(p=>p.key==='pilotagem');
  const pilotItems=[];
  if(phDes&&phPil)refsAtivas.forEach(r=>{
    const da=ix.rpByKey[r.id+'|'+phDes.id]?.completed_at, dp=ix.rpByKey[r.id+'|'+phPil.id]?.completed_at;
    if(da&&dp){const dias=diffDias(da,dp); if(dias>=0)pilotItems.push({code:r.code,family:r.family,line:r.line,desenho:da,pilotagem:dp,dias})}
  });
  pilotItems.sort((a,b)=>b.dias-a.dias);
  const piloto=pilotItems.length?{v:Math.round(pilotItems.reduce((s,x)=>s+x.dias,0)/pilotItems.length),n:pilotItems.length,items:pilotItems}:null;
  // Atas em 24h
  const reunioes=ritualsCol().filter(r=>r.scheduled_at&&r.scheduled_at.slice(0,10)<=hoje);
  const em24=reunioes.filter(r=>r.minutes_published_at&&(new Date(r.minutes_published_at)-new Date(r.scheduled_at))<=864e5).length;
  const atas=reunioes.length?{v:Math.round(em24/reunioes.length*100),n:em24,d:reunioes.length}:null;
  // manuais (mês corrente; senão, último lançado)
  const manual=k=>{const es=db.kpi_entries.filter(e=>e.kpi_key===k).sort((a,b)=>b.period.localeCompare(a.period));
    if(!es.length)return null;const e=es.find(x=>x.period===mes)||es[0];return{v:e.value,period:e.period}};
  // Cronograma: o que a gestora leva para a reunião e o que a diretoria cobra.
  const pan=panoramaCronograma(hoje);
  const pcp=pan.pcp&&pan.pcp.desvio!=null?{v:pan.pcp.desvio,congelado:pan.pcp.congelado,previsto:pan.pcp.previsto}:null;
  const semMargem={v:pan.semMargem,indefinidas:pan.indefinidas};
  const promessa=placarPromessas(hoje);
  const semDono=procsCol().filter(p=>!p.responsavel_user_id&&!(p.fim_real||p.completed_at)).length;
  const entrega=pan.entrega?{alvo:pan.entrega,previsto:pan.fimGeral,
    desvio:pan.fimGeral?diffDias(pan.entrega,pan.fimGeral):null,incompleta:pan.indefinidas>0}:null;
  return{macro,piloto,atas,rnc:manual('rnc'),otif:manual('otif_mp'),pcp,semMargem,entrega,promessa,semDono,motivos:motivosAgregados(),tecidos:tecidosAgregados(),hoje};
}
function kpiClass(val,meta,alerta,inverso){
  if(val==null)return'';
  if(inverso)return val<=meta?'s-ok':'s-late';
  return val>=meta?'s-ok':(val>=alerta?'s-warn':'s-late');
}

/* ---------------------------- pauta automática ---------------------------- */
function gerarPauta(){
  const hoje=hojeStr();
  const atras=procsCol().map(p=>({p,s:statusProcesso(p,hoje)})).filter(x=>x.s.k==='late')
    .sort((a,b)=>b.s.days-a.s.days);
  const cont=contadoresFase(refsCol(),hoje);
  const fasesCrit=db.phases.map(ph=>({ph,c:cont[ph.id]})).filter(x=>x.c.late>0).sort((a,b)=>b.c.late-a.c.late);
  const tVenc=tasksCol().filter(t=>t.status!=='concluida'&&t.status!=='cancelada'&&t.due_date&&t.due_date<hoje);
  let s='PAUTA — gerada automaticamente em '+fmtBRfull(hoje)+'\n\n';
  s+='1. CRONOGRAMA MACRO — processos em atraso ('+atras.length+')\n';
  atras.slice(0,10).forEach(x=>s+='   • '+x.p.name+' — '+x.s.days+' dias de atraso (prazo '+fmtBR(x.p.end_date)+')\n');
  if(!atras.length)s+='   • Nenhum processo em atraso ✔\n';
  s+='\n2. COLEÇÃO — fases com referências em atraso\n';
  fasesCrit.slice(0,6).forEach(x=>s+='   • '+x.ph.name+': '+x.c.late+' referência(s) em atraso\n');
  if(!fasesCrit.length)s+='   • Nenhuma fase com atraso ✔\n';
  s+='\n3. TAREFAS VENCIDAS ('+tVenc.length+')\n';
  tVenc.slice(0,8).forEach(t=>s+='   • '+t.title+' — '+(ix.userById[t.assignee_user_id]?.name||'?')+' (prazo '+fmtBR(t.due_date)+')\n');
  if(!tVenc.length)s+='   • Nenhuma ✔\n';
  s+='\n4. Bloqueios e necessidades da equipe\n5. Distribuição de tarefas da semana\n';
  return s;
}

/* ---------- tela inicial: escolher a coleção ----------
   Ponto de entrada do sistema. Cada cartão é uma coleção com o retrato do
   cronograma dela: dá para comparar as duas lado a lado antes de entrar. */
function vColecoes(){
  const hoje=hojeStr(),cs=colecoesComCronograma(),atual=colecaoAtivaId();
  const cards=cs.map(c=>{
    const ps=db.macro_processes.filter(p=>p.collection_id===c.id);
    const r=resumoColecao(c,ps,hoje);
    const sit=r.pcpDesvio==null?{k:'',t:'liberação para o PCP ainda sem data'}
      :r.pcpDesvio>0?{k:'mal',t:`liberação para o PCP com ${r.pcpDesvio} dias de atraso — prevista ${fmtBR(r.pcpPrevisto)}`}
      :{k:'bem',t:`liberação para o PCP no prazo (${fmtBR(r.pcpPrevisto)})`};
    return `<div class="col-card ${c.id===atual?'on':''} ${sit.k}" data-action="col-entrar" data-id="${c.id}" role="button" tabindex="0">
      <div class="cc-top">
        <div><div class="cc-nome">${esc(c.name)}</div>
          <div class="cc-per">${fmtBR(c.start_date)} → entrega ${fmtBR((c.marcos||{}).entrega_mostruario||c.end_date)}</div></div>
        ${c.id===atual?'<span class="badge b-rose">em uso</span>':''}
      </div>
      <div class="cc-barra"><div class="f" style="width:${r.pct}%"></div></div>
      <div class="cc-pct">${r.pct}% concluído · ${r.concluidas} de ${r.total} etapas</div>
      <div class="cc-sit ${sit.k}">${esc(sit.t)}</div>
      <div class="cc-tags">
        ${r.atrasadas?`<span class="badge b-late">${r.atrasadas} em atraso</span>`:'<span class="badge b-ok">sem atraso</span>'}
        ${r.semData?`<span class="badge b-warn">${r.semData} sem data</span>`:''}
        ${r.semDono?`<span class="badge b-warn">${r.semDono} sem dono</span>`:''}
      </div>
      <div class="cc-acao"><span class="btn btn-p btn-sm">entrar na coleção →</span></div>
    </div>`}).join('');
  const nova=can('admin')?`<div class="col-card nova w" data-action="col-nova" role="button" tabindex="0">
      <div class="cc-mais">＋</div>
      <div class="cc-nome">Nova coleção</div>
      <div class="cc-per">Copia as etapas, os macro temas e as dependências de uma coleção que já roda. As datas você define na reunião de planejamento.</div>
    </div>`:'';
  return `<div class="col-hero">
      <h2>Em qual coleção você vai trabalhar?</h2>
      <p>Cada coleção tem cronograma, donos e indicadores próprios — nada de uma interfere na outra. Clique para entrar.</p>
    </div>
    <div class="col-grid">${cards||'<div class="empty">Nenhuma coleção com cronograma ainda.</div>'}${nova}</div>`;
}
// Retrato de uma coleção, com a MESMA projeção usada na tela do cronograma:
// olhar só a data congelada do PCP diria "no prazo" mesmo com a cadeia empurrando.
function resumoColecao(c,ps,hoje){
  const total=ps.length;
  const concluidas=ps.filter(p=>p.fim_real||p.completed_at).length;
  const atrasadas=ps.filter(p=>!(p.fim_real||p.completed_at)&&p.end_date&&p.end_date<hoje).length;
  const semData=ps.filter(p=>!p.start_date&&!p.end_date).length;
  const semDono=ps.filter(p=>!p.responsavel_user_id&&!(p.fim_real||p.completed_at)).length;
  const pct=total?Math.round(concluidas/total*100):0;
  const sp=(c.marcos||{}).liberacao_pcp_seq;
  let pcpDesvio=null,pcpPrevisto=null;
  if(sp)comColecao(c.id,()=>{
    const proj=projetarCronograma(hoje),pcp=ps.find(p=>p.seq===sp);
    if(pcp&&pcp.end_date&&proj[sp]&&proj[sp].fim){
      pcpPrevisto=proj[sp].fim;pcpDesvio=diffDias(pcp.end_date,proj[sp].fim);
    }
  });
  return{total,concluidas,atrasadas,semData,semDono,pct,pcpDesvio,pcpPrevisto};
}

/* ---------- catálogos do produto ----------
   Listas simples de nomes, usadas como opções no cadastro de referência.
   Guardamos o NOME na referência (não um id): o export sai legível, e renomear
   aqui nunca quebra o cadastro de uma peça. O time mantém as listas sozinho. */
const CATALOGOS={
  tipos:{nm:'Tipos de produto',ds:'O que é a peça: sutiã, calcinha, body…',ic:'✿'},
  cores:{nm:'Cores',ds:'As cores em que as referências saem.',ic:'◐'},
  tamanhos:{nm:'Tamanhos',ds:'A grade de tamanhos da peça.',ic:'⊞'},
  tecidos:{nm:'Tecidos principais',ds:'O tecido que define a peça — vira indicador no Painel.',ic:'⌘'},
};
const CATALOGO_PADRAO={
  tipos:['Sutiã','Calcinha','Body','Camisola','Top','Short Doll','Robe','Corset','Pijama','Cinta'],
  cores:['Preto','Branco','Off White','Nude','Rosa','Vermelho','Azul Marinho'],
  tamanhos:['PP','P','M','G','GG','XGG'],
  tecidos:['Renda','Microfibra','Algodão','Tule','Cetim','Malha','Viscose'],
};
function catalogo(k){const c=db.catalogos||{};return Array.isArray(c[k])?c[k]:[]}
function catalogoAdd(k,nome){
  nome=String(nome||'').trim();
  if(!nome)return false;
  const lista=catalogo(k);
  if(lista.some(x=>x.toLowerCase()===nome.toLowerCase()))return false;
  commit(x=>{x.catalogos=x.catalogos||{};x.catalogos[k]=[...(x.catalogos[k]||[]),nome].sort((a,b)=>a.localeCompare(b,'pt-BR'))});
  return true;
}
// Quantas referências usam este item — para avisar antes de remover do catálogo.
function catalogoEmUso(k,nome){
  const n=String(nome).toLowerCase();
  return (db.references||[]).filter(r=>{
    if(k==='tipos')return String(r.tipo_produto||'').toLowerCase()===n;
    if(k==='tecidos')return String(r.tecido_principal||'').toLowerCase()===n;
    if(k==='cores')return (r.cores||[]).some(c=>String(c).toLowerCase()===n);
    if(k==='tamanhos')return (r.tamanhos||[]).some(t=>String(t).toLowerCase()===n);
    return false;
  }).length;
}

/* ---------------------------- CRONOGRAMA ---------------------------- */
function vCronograma(){
  const hoje=hojeStr(),f=ST.cronograma,v=f.view;
  const pan=panoramaCronograma(hoje);
  let ps=procsOrdenados();
  if(f.tema)ps=ps.filter(p=>(p.macro_tema||'—')===f.tema);
  if(f.sit)ps=ps.filter(p=>{
    const st=situacaoProc(p,pan.proj,pan.mg),a=atencaoProc(p,hoje,st);
    if(f.sit==='concluida')return !!(p.fim_real||p.completed_at);
    if(f.sit==='sem_dono')return !p.responsavel_user_id&&!(p.fim_real||p.completed_at);
    if(f.sit==='atencao')return !!a;
    return a&&a.k===f.sit;
  });
  const temas=[...new Set(procsOrdenados().map(p=>p.macro_tema||'—'))].sort((a,b)=>ordemTema(a)-ordemTema(b));
  const head=faixaImpacto(pan,hoje)+`<div class="toolbar">
    <div class="seg" id="cr-toggle"><button class="${v==='lista'?'on':''}" data-action="cr-view" data-v="lista">Lista</button><button class="${v==='gantt'?'on':''}" data-action="cr-view" data-v="gantt">Linha do tempo</button></div>
    <div class="f"><label>Macro tema</label><select data-cfilter="tema"><option value="">Todos</option>${temas.map(t=>`<option ${f.tema===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="f"><label>Situação</label><select data-cfilter="sit">
      <option value="">Todas</option>
      <option value="atencao" ${f.sit==='atencao'?'selected':''}>⚠ Precisa de atenção</option>
      <option value="atrasada" ${f.sit==='atrasada'?'selected':''}>Em atraso</option>
      <option value="vencendo" ${f.sit==='vencendo'?'selected':''}>Vence em 7 dias</option>
      <option value="sem_margem" ${f.sit==='sem_margem'?'selected':''}>Sem margem</option>
      <option value="sem_dono" ${f.sit==='sem_dono'?'selected':''}>Sem dono</option>
      <option value="concluida" ${f.sit==='concluida'?'selected':''}>Concluídas</option>
    </select></div>
    <div style="flex:1"></div>
    <span class="badge b-ok">Em dia: ${ps.filter(p=>statusProcesso(p,hoje).k==='ok').length}</span>
    <span class="badge b-late">Em atraso: ${ps.filter(p=>statusProcesso(p,hoje).k==='late').length}</span>
    <span class="badge b-rose">Concluídos: ${ps.filter(p=>statusProcesso(p,hoje).k==='done').length}</span>
  </div>`;
  if(v==='gantt')return head+vGantt(ps,hoje,pan);
  return head+`<div class="card" style="padding:0;overflow:auto" id="cr-tabela"><table>
    <thead><tr><th>#</th><th>Processo</th><th>Dono</th><th>Macro tema</th><th>Prazo congelado</th><th>Real / previsto</th><th>Desvio</th><th>Margem até o PCP</th><th>Situação</th><th class="w"></th></tr></thead>
    <tbody>${ps.map(p=>{const st=situacaoProc(p,pan.proj,pan.mg);
      return `<tr>
        <td>${p.seq}</td><td><b>${esc(p.name)}</b>${st.paralelo?' <span title="não depende de nenhuma outra etapa" style="color:var(--muted)">∥</span>':''}</td>
        <td>${p.responsavel_user_id?esc(nomeDono(p)):(p.fim_real||p.completed_at?'<span style="color:var(--muted)">—</span>':'<span class="badge b-warn" title="etapa sem dono: equipe não entrega, pessoa entrega">sem dono</span>')}</td>
        <td>${p.macro_tema?`<span class="badge b-rose">${esc(p.macro_tema)}</span>`:'—'}</td>
        <td>${fmtBR(p.start_date)} → ${fmtBR(p.end_date)}</td>
        <td>${st.origem==='indefinido'?'<span style="color:var(--muted)">sem data definida</span>':(fmtBR(st.ini)+' → '+fmtBR(st.fim)+(st.origem==='projetado'?' <span style="color:var(--warn);font-size:10px">previsto</span>':''))}</td>
        <td>${textoDesvio(st)}</td>
        <td>${textoMargem(st)}</td>
        <td>${badgeProc(p,hoje)}${(()=>{const sp=situacaoPromessa(p,hoje);
          return sp&&sp.k!=='cumprida'?`<br><span class="badge ${sp.k==='quebrada'?'b-late':'b-warn'}" style="margin-top:3px" title="data combinada na reunião">prometido ${fmtBR(sp.data)}</span>`:''})()}</td>
        <td class="w"><button class="btn btn-g btn-sm" data-action="proc-edit" data-id="${p.id}">editar</button></td>
      </tr>`}).join('')}</tbody></table></div>`;
}
function badgeProc(p,hoje){const s=statusProcesso(p,hoje);
  if(s.k==='done')return`<span class="badge b-ok">Concluído${s.late?' c/ atraso':''} ${fmtBR(p.completed_at)}</span>`;
  if(s.k==='late')return`<span class="badge b-late">${s.days} dias em atraso</span>`;
  // antecipação: avisa antes de virar atraso
  if(p.end_date){const faltam=diffDias(hoje,p.end_date);
    if(faltam===0)return'<span class="badge b-warn">vence hoje</span>';
    if(faltam<=7)return`<span class="badge b-warn">vence em ${faltam} dia(s)</span>`}
  return'<span class="badge b-ok">Em dia</span>'}
function textoDesvio(st){
  if(st.desvio==null)return'—';
  if(st.desvio>0)return`<b style="color:var(--late)">+${st.desvio} d</b>`;
  if(st.desvio<0)return`<span style="color:var(--ok)">${st.desvio} d</span>`;
  return'<span style="color:var(--ok)">no prazo</span>';
}
function textoMargem(st){
  if(st.paralelo&&!st.dentroDaCadeia)return'<span style="color:var(--muted)" title="roda em paralelo: não empurra a cadeia">roda em paralelo</span>';
  if(!st.dentroDaCadeia)return'<span style="color:var(--muted)">fora da cadeia</span>';
  if(st.margemBloqueada)return'<span style="color:var(--warn)" title="uma etapa do caminho está sem data na planilha">cadeia sem data</span>';
  if(st.margem==null)return'—';
  if(st.margem<0)return`<b style="color:var(--late)">${st.margem} d</b>`;
  if(st.margem===0)return'<b style="color:var(--late)">sem margem</b>';
  return`<span style="color:var(--ok)">${st.margem} d</span>`;
}

/* --- zoom da linha do tempo: mês (coleção inteira) → semana → dia ---
   "Aproximar" desce um nível e "afastar" sobe. Clicar numa etapa já aproxima nela. */
function focoPadrao(){
  const hoje=hojeStr(),ds=procsCol().flatMap(p=>[p.start_date,p.end_date]).filter(Boolean).sort();
  if(!ds.length)return hoje;
  return hoje<ds[0]?ds[0]:(hoje>ds[ds.length-1]?ds[ds.length-1]:hoje);
}
const NIVEIS=['mes','semana','dia'];
const NIVEL_ROT={mes:'Mês',semana:'Semana',dia:'Dia'};
const NIVEL_DIAS={semana:84,dia:28};     // largura da janela em cada nível
const NIVEL_PASSO={mes:60,semana:28,dia:7}; // quanto as setas andam
function janelaGantt(nivel,foco,min,max){
  if(nivel==='mes')return{ini:min,fim:max};
  const n=NIVEL_DIAS[nivel],ini=addDias(foco,-Math.round(n/3));
  return{ini,fim:addDias(ini,n)};
}
function reguaGantt(nivel,ini,fim,pos){
  let out='',cur;
  if(nivel==='mes'){
    cur=ini.slice(0,8)+'01';
    while(cur<=fim){out+=`<div class="g-mes" style="left:${pos(cur)}%">${fmtMesCurto(cur)}</div>`;
      cur=addDias(cur.slice(0,8)+'01',32).slice(0,8)+'01'}
  }else if(nivel==='semana'){
    cur=ini;
    while(cur<=fim){out+=`<div class="g-mes forte" style="left:${pos(cur)}%">${cur.slice(8,10)}/${cur.slice(5,7)}</div>`;
      cur=addDias(cur,7)}
  }else{
    cur=ini;
    while(cur<=fim){const dow=new Date(cur+'T00:00:00Z').getUTCDay();
      out+=`<div class="g-mes ${dow===1?'forte':''}" style="left:${pos(cur)}%">${(dow===0||dow===6)?'·':cur.slice(8,10)}</div>`;
      cur=addDias(cur,1)}
  }
  return out;
}
function vGantt(ps,hoje,pan){
  const proj=pan.proj,mg=pan.mg,f=ST.cronograma;
  const datas=[];
  ps.forEach(p=>{[p.start_date,p.end_date,proj[p.seq].ini,proj[p.seq].fim].forEach(d=>{if(d)datas.push(d)})});
  if(pan.entrega)datas.push(pan.entrega);
  datas.push(hoje);
  if(!datas.length)return'<div class="empty">Sem datas no cronograma.</div>';
  datas.sort();
  const min=datas[0],max=datas[datas.length-1];
  const nivel=f.zoom||'mes',foco=f.foco||hoje;
  const jan=janelaGantt(nivel,foco,min,max);
  const span=Math.max(diffDias(jan.ini,jan.fim),1);
  const pos=d=>Math.min(100,Math.max(0,diffDias(jan.ini,d)/span*100));
  const dentro=d=>d&&d>=jan.ini&&d<=jan.fim;
  const visivel=(a,b)=>!(!a&&!b)&&!( (b||a)<jan.ini || (a||b)>jan.fim ); // cruza a janela?
  const sel=f.sel,suc=sucessoresPorSeq();
  const naCadeiaSel=sel?cadeiaAFrente(sel,suc):{};
  const regua=reguaGantt(nivel,jan.ini,jan.fim,pos);
  const marcos=(dentro(hoje)?`<div class="g-today" style="left:${pos(hoje)}%"></div>`:'')+
    (pan.pcp&&dentro(pan.pcp.congelado)?`<div class="g-marco ${pos(pan.pcp.congelado)>85?'fim':''}" data-rot="PCP" style="left:${pos(pan.pcp.congelado)}%"></div>`:'')+
    (dentro(pan.entrega)?`<div class="g-marco ${pos(pan.entrega)>85?'fim':''}" data-rot="mostruário" style="left:${pos(pan.entrega)}%"></div>`:'');
  const idxNivel=NIVEIS.indexOf(nivel);
  const barraZoom=`<div class="g-zoom">
    <div class="seg">${NIVEIS.map(z=>`<button class="${z===nivel?'on':''}" data-action="cr-zoom" data-z="${z}">${NIVEL_ROT[z]}</button>`).join('')}</div>
    <button class="btn btn-g btn-sm" data-action="cr-drill" data-dir="out" ${idxNivel===0?'disabled':''} title="afastar: ver um período maior">⊖ afastar</button>
    <button class="btn btn-g btn-sm" data-action="cr-drill" data-dir="in" ${idxNivel===NIVEIS.length-1?'disabled':''} title="aproximar: ver em mais detalhe">⊕ aproximar</button>
    ${nivel!=='mes'?`<span class="g-nav">
      <button class="btn btn-g btn-sm" data-action="cr-nav" data-d="-1" title="período anterior">‹</button>
      <b>${fmtBR(jan.ini)} a ${fmtBR(jan.fim)}</b>
      <button class="btn btn-g btn-sm" data-action="cr-nav" data-d="1" title="próximo período">›</button>
      <button class="btn btn-o btn-sm" data-action="cr-hoje">hoje</button></span>`
     :'<span class="g-nav" style="color:var(--muted)">coleção inteira</span>'}
  </div>`;
  let html='',temaAtual=null;
  [...ps].sort((a,b)=>ordemTema(a.macro_tema)-ordemTema(b.macro_tema)||a.seq-b.seq).forEach(p=>{
    const tema=p.macro_tema||'—';
    if(tema!==temaAtual){temaAtual=tema;
      const doTema=ps.filter(x=>(x.macro_tema||'—')===tema);
      html+=`<div class="g-tema"><div class="g-label">${esc(tema)} · ${doTema.length} etapa(s)</div><div class="g-track"></div></div>`}
    const st=situacaoProc(p,proj,mg);
    const cls=[sel===p.seq?'g-sel':'',sel&&naCadeiaSel[p.seq]?'g-dep':''].filter(Boolean).join(' ');
    const flags=(st.critico?'<span class="g-flag" title="sem margem de manobra">⚑</span>':'')+
      (st.paralelo?'<span class="g-flag" style="color:var(--muted)" title="roda em paralelo — não é empurrada por ninguém">∥</span>':'')+
      (pan.pcp&&pan.pcp.p.seq===p.seq?'<span class="g-flag" style="color:var(--late)" title="marco que não pode furar">★</span>':'');
    let barras='';
    if(visivel(p.start_date,p.end_date)){const l=pos(p.start_date||jan.ini);
      barras+=`<div class="g-base" style="left:${l}%;width:${Math.max(pos(p.end_date||jan.fim)-l,.5)}%" title="prazo congelado: ${fmtBR(p.start_date)} → ${fmtBR(p.end_date)}"></div>`}
    if(st.origem==='indefinido'){
      if(visivel(p.end_date||hoje,p.end_date||hoje))
        barras+=`<div class="g-bar semdata" style="left:${pos(p.end_date||hoje)}%;width:3%" title="sem data definida na planilha"></div>`;
    }else if(visivel(st.ini,st.fim)){
      const l=pos(st.ini||jan.ini),w=Math.max(pos(st.fim||jan.fim)-l,.6);
      const k=st.origem==='real'?(st.desvio>0?'late':'done'):'proj';
      barras+=`<div class="g-bar ${k} ${st.critico?'critica':''}" style="left:${l}%;width:${w}%" title="${st.origem==='real'?'realizado':'previsto'}: ${fmtBR(st.ini)} → ${fmtBR(st.fim)}${st.incompleto?' (projeção incompleta)':''}"><div class="fill" style="width:${p.percent_complete||0}%"></div></div>`;
      if(st.desvio>0&&dentro(st.fim))barras+=`<div class="g-desvio" style="left:${Math.min(pos(st.fim),96)}%">+${st.desvio}d</div>`;
    }else if(st.fim){
      // fora da janela: seta indicando para que lado a etapa está
      barras+=st.fim<jan.ini?`<div class="g-fora esq" title="esta etapa terminou em ${fmtBR(st.fim)}, antes deste período">‹</div>`
                            :`<div class="g-fora dir" title="esta etapa só acontece em ${fmtBR(st.ini)}, depois deste período">›</div>`;
    }
    html+=`<div class="g-row ${cls}" data-action="cr-sel" data-seq="${p.seq}" title="clique para ver o que esta etapa empurra">
      <div class="g-label"><span class="g-nome">${p.seq}. ${esc(p.name)}</span>${flags}</div>
      <div class="g-track">${barras}</div></div>`;
  });
  const selP=sel?ps.find(x=>x.seq===sel):null;
  const aviso=selP?`<div style="font-size:11.5px;color:var(--rose-dark);margin:8px 2px">Destacando o que <b>${esc(selP.name)}</b> empurra: ${Object.keys(naCadeiaSel).length} etapa(s) à frente. <button class="btn btn-g btn-sm" data-action="cr-sel" data-seq="">limpar</button></div>`:'';
  return barraZoom+`<div class="gantt" id="cr-gantt"><div class="g-regua"><div class="g-label">${NIVEL_ROT[nivel].toUpperCase()}</div><div class="g-track">${regua}</div></div><div class="g-marcos">${marcos}</div>${html}</div>${aviso}
  <div class="legend">
    <span><span class="sw" style="background:var(--rose-pale);height:7px;border-radius:4px"></span>prazo congelado</span>
    <span><span class="sw" style="background:var(--ok-bg)"></span>realizado no prazo</span>
    <span><span class="sw" style="background:var(--late-bg);outline:1.5px solid var(--late)"></span>realizado com atraso</span>
    <span><span class="sw" style="background:var(--warn-bg);outline:1.5px solid var(--warn)"></span>ainda previsto</span>
    <span><span class="sw" style="outline:1.5px dashed var(--na)"></span>sem data na planilha</span>
    <span>⚑ sem margem</span><span>∥ roda em paralelo</span><span>★ não pode furar</span><span>‹ › fora deste período</span>
  </div>`;
}

    ${(f.prazo||f.ata||f.pessoa||f.so_minhas)?`<button class="btn btn-g btn-sm" data-action="task-clear-filtros" style="align-self:center">limpar filtros</button>`:''}
    <div style="flex:1"></div>
    <button class="btn btn-p w" data-action="task-new" id="btn-nova-tarefa">＋ Nova tarefa</button>
  </div>
  ${ts.length?'':'<div class="empty">Nenhuma tarefa com esses filtros. As tarefas substituem o caderno: <b>toda demanda da reunião vira um cartão aqui</b>, com responsável, prazo e a <b>ata de origem</b>. Clique em “＋ Nova tarefa”.</div>'}
  <div class="kanban" id="kanban">${cols.map(([k,lab])=>{const list=ts.filter(t=>t.status===k);
    return `<div class="kcol"><h4>${lab}<span>${list.length}</span></h4>${list.map(kcard).join('')}</div>`}).join('')}</div>`;
}

/* ---------------------------- RITUAIS ---------------------------- */
const RIT_TIPOS={
  semanal:{nm:'Ritual semanal de cronograma',freq:'Segunda · 60 min',ds:'Prazos, distribuição de tarefas e bloqueios. Ata em até 24h.'},
  briefing_diario:{nm:'Briefing diário matinal',freq:'Diário · 15 min',ds:'Alinhamento rápido do dia com a célula operacional.'},
  quinzenal_interfaces:{nm:'Batimento de interfaces',freq:'Quinzenal',ds:'Compras, Qualidade, Engenharia e PCP — demandas e escalonamentos.'},
  mensal_diretoria:{nm:'Reporte à Diretoria',freq:'Mensal',ds:'Status de cronograma, KPIs, riscos e decisões para o Cairo.'},
};
function vRituais(){
  const hoje=hojeStr();
  const rs=[...ritualsCol()].sort((a,b)=>(b.scheduled_at||'').localeCompare(a.scheduled_at||''));
  return `
  <div class="rit-cad" id="rit-cadencia">${Object.entries(RIT_TIPOS).map(([k,v])=>`
    <div class="card"><div class="freq">${v.freq}</div><div class="nm">${v.nm}</div><div class="ds">${v.ds}</div>
    <div style="margin-top:9px" class="w"><button class="btn btn-o btn-sm" data-action="rit-new" data-tipo="${k}">＋ registrar reunião</button></div></div>`).join('')}
  </div>
  <div class="card" style="margin-bottom:16px" id="rit-lista"><h3>Reuniões registradas</h3>
    ${rs.length?rs.map(r=>{const t=RIT_TIPOS[r.type]||{nm:r.type};
      const dt=r.scheduled_at?r.scheduled_at.slice(0,10):null;
      const pub=r.minutes_published_at;
      const h24=pub?((new Date(pub)-new Date(r.scheduled_at))<=864e5):null;
      const pend=!pub&&dt&&dt<=hoje;
      const horas=pend?Math.round((Date.now()-new Date(r.scheduled_at))/36e5):0;
      return `<div class="rit-item">
        <div><div class="ti">${t.nm}</div><div class="ms">${fmtBRfull(dt)} · ${(r.attendance||[]).filter(a=>a.present).length} presentes</div></div>
        <div style="margin-left:auto">${pub?`<span class="badge ${h24?'b-ok':'b-warn'}">ata ${h24?'em 24h ✓':'fora das 24h'}</span>`
          :`<span class="badge ${horas>24?'b-late':'b-warn'}">ata pendente${horas>0?' · '+horas+'h':''}</span>`}</div>
        <button class="btn btn-g btn-sm" data-action="rit-open" data-id="${r.id}">abrir</button>
      </div>`}).join(''):'<div class="empty">Nenhuma reunião ainda. <b>Toda segunda-feira</b>, clique em “registrar reunião” no Ritual semanal: a <b>pauta nasce pronta</b> com os atrasos e pendências da semana.</div>'}
  </div>`;
}

      <section class="man-sec" id="s-painel">
        <h3><span class="nicon">◈</span> 3. Painel de Indicadores</h3>
        <div class="lead">É a sua "tela do dia": em 30 segundos você sabe como o setor está.</div>
        <p>No topo, a faixa rosé mostra a coleção ativa, quantos <b>dias faltam para a entrega do mostruário</b> e o avanço médio do cronograma. Abaixo ficam os cartões de indicadores (KPIs), cada um com a <b>meta combinada</b>, o <b>gatilho de alerta</b> e o <b>responsável</b>.</p>
        <h4>Como ler as cores</h4>
        <div class="man-leg">

        <p>Os cartões <b>cinza</b> ainda não têm histórico — esta coleção é a <b>linha de base</b>. Não é problema: é o ponto de partida para medir a evolução. Três indicadores o sistema <b>calcula sozinho</b>: <b>Cumprimento do Cronograma</b> (realizado vs previsto — meta ≥ 95%), <b>Tempo de Pilotagem</b> (do fim do Desenho ao fim da Pilotagem, com média e visão por referência) e <b>Atas em 24h</b>. Dois você <b>lança uma vez por mês</b>:</p>
        <div class="steps">
