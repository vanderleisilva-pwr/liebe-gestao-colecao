        <div class="callout dica">Os blocos de alerta embaixo (processos atrasados, fases críticas, pendências) são exatamente o que vira a <b>pauta da reunião de segunda</b> — você não precisa montar nada à mão.</div>
      </section>

      <section class="man-sec" id="s-cronograma">
        <h3><span class="nicon">▤</span> 4. Cronograma Macro</h3>
        <div class="lead">Os ${nProc} processos da coleção, do briefing inspiracional à produção das peças de catálogo.</div>
        <p>Há duas formas de ver, no botão no topo: <b>Lista</b> (para o dia a dia) e <b>Linha do tempo</b> (a coleção inteira de uma vez, com uma linha marcando "hoje"). O <b>status é calculado sozinho</b>: se um processo passou do prazo sem conclusão, aparece "X dias em atraso" — o sistema mostra o atraso, ninguém precisa apontar o dedo.</p>

        <h4>As três datas de cada etapa</h4>
        <p>Esta é a mudança mais importante. Cada etapa passou a ter:</p>
        <div class="man-leg">
          <div><b>Prazo congelado</b> — o que foi combinado no começo da coleção. <b>Nunca muda</b>, para que sempre dê para comparar o combinado com o que aconteceu de fato.</div>
          <div><b>Realizado</b> — quando a etapa começou e terminou de verdade. É isso que vocês preenchem aqui na plataforma.</div>
          <div><b>Previsto</b> — para o que ainda não terminou, a data que o sistema calcula sozinho, já considerando os atrasos que vieram das etapas anteriores.</div>
        </div>
        <p>Na Linha do tempo, a <b>barra fina clara</b> é o prazo congelado e a <b>barra cheia</b> é o realizado (ou o previsto). A distância entre as duas é o atraso, e o número ao lado diz de quantos dias.</p>

        <h4>O que empurra o quê</h4>
        <p>Cada etapa diz de quais outras ela depende. Quando uma atrasa, o sistema empurra sozinho todas as que vêm depois dela e mostra as novas datas.</p>
        <div class="man-leg">
          <div><b>∥ roda em paralelo</b> — não depende de ninguém. Atraso de outra etapa <b>não</b> mexe nela.</div>
          <div><b>⚑ sem margem de manobra</b> — se atrasar um dia, empurra a liberação para o PCP no mesmo dia.</div>
          <div><b>★ não pode furar</b> — a liberação da coleção para o PCP, que está amarrada ao prazo de compra da matéria-prima.</div>
          <div><b>tracejado</b> — etapa sem data na planilha. O sistema não inventa data: avisa que falta.</div>
        </div>
        <p>Clique em qualquer etapa da Linha do tempo para <b>acender tudo que ela empurra</b> à frente.</p>

        <h4>"Se isso atrasar, atrasa o mostruário?"</h4>
        <p>Abra a etapa em "editar", digite quantos dias de atraso quer testar e clique em <b>ver o impacto</b>. O sistema responde quais etapas seriam empurradas, em quantos dias cada uma, e se a liberação para o PCP é afetada. Serve para decidir na hora se dá para absorver o atraso ou se precisa de plano de ação.</p>
        <p>A faixa no topo da tela já traz o resumo: quantas etapas saíram do prazo, como está a liberação para o PCP e para quando a cadeia está empurrando a entrega do mostruário.</p>

        <h4>Atualizar um processo (faça na reunião de segunda)</h4>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "editar" na linha do processo</div><div class="st-d">Abre uma janelinha com os campos.</div></div>
          <div class="step"><div class="st-t">Preencha o início e o fim reais</div><div class="st-d">As datas em que a etapa realmente começou e terminou. É daqui que sai todo o recálculo.</div></div>
          <div class="step"><div class="st-t">Ajuste o % de avanço</div><div class="st-d">Quanto daquele processo já foi feito.</div></div>
          <div class="step"><div class="st-t">Confirme o dono</div><div class="st-d">Quem entrega esta etapa. Um nome, não um setor.</div></div>
          <div class="step"><div class="st-t">Se estiver atrasada: nova data prometida + por que atrasou</div><div class="st-d">Os dois campos só aparecem quando a etapa está em atraso. São o plano de ação em duas linhas.</div></div>
          <div class="step"><div class="st-t">Concluiu? Use "✓ Concluir hoje"</div><div class="st-d">Marca 100% e registra a data de hoje como fim real, de uma vez.</div></div>
        </div>
        <p>Com pressa? Use o filtro <b>Situação → ⚠ Precisa de atenção</b> e atualize só o que realmente pede conversa.</p>
        <p style="font-size:12px;color:var(--muted)">O prazo congelado não é editável pela tela de propósito: ele é a memória do combinado. Se o cronograma da coleção for renegociado, isso é feito na planilha e entra pela faixa de "atualizar coleção".</p>
      </section>

      <section class="man-sec" id="s-praticas">
        <h3><span class="nicon">◎</span> 5. Como fazer o cronograma andar no prazo</h3>
        <div class="lead">Sem teoria de gestão de projetos. São seis hábitos simples — se o time seguir só estes, o cronograma para de derrapar.</div>

        <h4>Hábito 1 — A reunião de segunda, em 30 minutos</h4>
        <p>Abra o <b>Cronograma Macro</b> e passe pela faixa do topo, da esquerda para a direita. Ela foi feita para essa conversa: quantas etapas saíram do prazo, como está a liberação para o PCP, para quando a entrega está sendo empurrada e <b>o que vence nos próximos 7 dias</b>.</p>
        <p>Depois desça na lista e olhe só três coisas:</p>
        <div class="steps">
          <div class="step"><div class="st-t">O que está vermelho (em atraso)</div><div class="st-d">Para cada uma: o que falta para terminar, quem vai fazer e <b>em que data</b>. Sem data nova, não é plano — é torcida.</div></div>
          <div class="step"><div class="st-t">O que está amarelo (vence em até 7 dias)</div><div class="st-d">Esta é a lista mais importante da reunião. É aqui que dá para evitar o atraso, em vez de explicá-lo depois.</div></div>
          <div class="step"><div class="st-t">O que começa agora</div><div class="st-d">Confirme que quem vai tocar já sabe e já tem o que precisa (material, ficha, aprovação).</div></div>
        </div>
        <p><b>Atalho:</b> no filtro <b>Situação</b>, escolha <b>"⚠ Precisa de atenção"</b> — a lista já vem com o que está atrasado, o que vence em 7 dias, o que não tem margem e o que está sem data. É a pauta da reunião pronta.</p>
        <p>E em <b>Rituais &amp; Atas</b>, ao abrir o ritual semanal, use <b>"⟳ gerar do cronograma"</b>: a pauta se escreve sozinha, já na ordem de prioridade e com o dono de cada etapa. Revise, converse em cima dela e publique a ata.</p>
        <p>Registre as decisões no mesmo dia e transforme cada combinado em card no <b>Quadro de Tarefas</b>. O que não vira tarefa com dono e data, não acontece.</p>

        <h4>Hábito 2 — As três perguntas que resolvem quase tudo</h4>
        <p>Para qualquer etapa, na reunião ou no corredor:</p>
        <div class="man-leg">
          <div><b>1. Já começou?</b> Se não começou e já devia ter começado, o atraso já existe — só ainda não apareceu.</div>
          <div><b>2. Vai terminar na data?</b> Pergunte agora, não na véspera.</div>
          <div><b>3. Se não vai, o que precisa para terminar?</b> Quase sempre a resposta é material, decisão de alguém ou gente. As três têm solução — desde que apareçam cedo.</div>
        </div>

        <h4>Hábito 3 — Atrasou: o que fazer em 5 minutos</h4>
        <div class="steps">
          <div class="step"><div class="st-t">Pergunte ao sistema se isso empurra alguém</div><div class="st-d">Abra a etapa em "editar" e use <b>"se esta etapa atrasar → ver o impacto"</b>. Ele responde quem é empurrado e em quantos dias.</div></div>
          <div class="step"><div class="st-t">Não empurra ninguém? Registre e siga</div><div class="st-d">Atraso que não derruba a cadeia não merece reunião. Anote e toque o barco.</div></div>
          <div class="step"><div class="st-t">Empurra a liberação para o PCP? Plano de ação hoje</div><div class="st-d">Essa é a data que não pode furar, porque a matéria-prima tem prazo de compra. Aqui não se espera a próxima segunda.</div></div>
          <div class="step"><div class="st-t">Combine data e dono, e registre no card da etapa</div><div class="st-d">"A Fulana entrega até quinta" é um plano. "Vamos correr" não é. No card há o campo <b>Nova data prometida</b> — preencha ali, junto com <b>por que atrasou</b>.</div></div>
        </div>
        <p>Toda data prometida fica guardada no histórico da etapa. Quando ela é concluída, o sistema compara: <b>entregou no que prometeu ou não?</b> Esse é o indicador <b>"Promessas de Recuperação Cumpridas"</b> no Painel — e é o número que muda comportamento, porque mostra quem combina data e cumpre.</p>
        <p style="font-size:12px;color:var(--muted)">Prometer de novo não apaga a promessa anterior: as duas ficam no histórico. É proposital — replanejar três vezes a mesma etapa é um sinal que precisa aparecer.</p>

        <h4>Hábito 4 — Não mexa no prazo combinado</h4>
        <p>O <b>prazo congelado</b> é a memória do que foi acordado no início da coleção. Ele não muda — nem quando atrasa, nem para "ficar verde". O que você preenche é o <b>início e o fim reais</b>.</p>
        <p>Parece detalhe, mas é o que permite, no fim da coleção, olhar para trás e dizer: "esta etapa sempre estoura em duas semanas, então no próximo cronograma ela nasce com duas semanas a mais". É assim que o cronograma do ano que vem fica realista — e a coleção deixa de atrasar por planejamento errado.</p>
        <p style="font-size:12px;color:var(--muted)">Se o cronograma precisar mesmo ser renegociado, isso é decisão de reunião: muda na planilha, entra pela faixa de "atualizar coleção" e fica registrado.</p>

        <h4>Hábito 5 — Saber o que dá para absorver e o que não dá</h4>
        <p>Nem todo atraso é igual, e essa é a diferença entre apagar incêndio e gerir:</p>
        <div class="man-leg">
          <div><b>∥ Roda em paralelo</b> — não depende de ninguém e ninguém depende dela. Atrasou? Dá para reorganizar sem drama.</div>
          <div><b>Sem sucessor</b> — quando você abre a etapa, o sistema avisa "não empurra nenhuma etapa". Mesma coisa: o atraso fica contido ali.</div>
          <div><b>⚑ Sem margem de manobra</b> — se atrasar um dia, empurra a liberação para o PCP no mesmo dia. Aqui não existe "depois a gente corre".</div>
          <div><b>★ Não pode furar</b> — a liberação para o PCP. Se essa data cai, o mostruário cai junto, e junto vai a venda.</div>
        </div>
        <p>Na dúvida, clique na etapa na <b>Linha do tempo</b>: o sistema acende tudo que vem depois dela.</p>

        <h4>Hábito 6 — Cada etapa precisa ter data e dono</h4>
        <p>Etapa sem data aparece tracejada, e o sistema avisa que não consegue prever o que vem depois dela. Não é frescura do sistema: se uma etapa do meio não tem data, ninguém consegue dizer se a entrega está de pé. <b>Etapa sem data é ponto cego.</b></p>
        <p>O mesmo vale para dono: "o setor" não entrega nada — pessoas entregam. No card de cada etapa há o campo <b>Dono desta etapa (quem entrega)</b>. Etapa sem dono aparece com a marca <b>"sem dono"</b> na lista, e o Painel conta quantas estão assim.</p>
        <p>Não é burocracia: quando chega a segunda-feira e a etapa não andou, a pergunta "quem estava com isso?" já tem resposta, e a conversa começa da solução em vez de começar da procura do responsável.</p>

        <h4>Os cinco erros que mais atrasam coleção</h4>
        <div class="man-leg">
          <div><b>Mudar a data para ficar verde.</b> O painel melhora, a coleção continua atrasada e ninguém aprende nada com isso.</div>
          <div><b>Marcar 100% sem preencher a data real.</b> Sem a data, o sistema não recalcula o que vem depois e a previsão fica mentirosa.</div>
          <div><b>Descobrir o atraso na data de entrega.</b> Por isso a lista de "vence em 7 dias" existe: o momento de agir é antes.</div>
          <div><b>Cobrar prazo de quem não decide prazo.</b> Prazo se cobra com a Joice; estilo e técnica, com a Anna. Cobrar a pessoa errada gera ruído e nenhum resultado.</div>
          <div><b>Deixar o fornecedor fora do cronograma.</b> Foi o atraso das rendas importadas que derrubou o mostruário. O que vem de fora precisa ter data e acompanhamento igual ao que é feito dentro de casa.</div>
        </div>

        <h4>No fim da coleção, 20 minutos que valem o ano inteiro</h4>
        <p>Junte o time e compare o <b>prazo congelado</b> com o <b>realizado</b> de cada etapa. Três perguntas:</p>
        <div class="man-leg">
          <div>Quais etapas sempre estouram? Elas nascem com prazo irreal — corrija no próximo cronograma.</div>
          <div>Onde o tempo foi embora? O Painel tem o quadro <b>"Por que atrasou nesta coleção"</b>, somando os motivos que vocês registraram. Se "material ou fornecedor atrasou" lidera, o problema não é da equipe — é de prazo de compra, e se resolve com folga planejada.</div>
          <div>Quais atrasos vieram de fora (fornecedor, outra área)? Esses precisam de folga planejada, não de cobrança.</div>
          <div>O que a gente descobriu tarde demais? Esse é o sinal que faltou no acompanhamento semanal.</div>
        </div>
        <p>Anote as conclusões na ata do último ritual da coleção. É esse documento que faz a próxima coleção começar melhor que esta.</p>
      </section>

      <section class="man-sec" id="s-nova-colecao">
        <h3><span class="nicon">✦</span> 6. Criar e sustentar uma coleção</h3>
        <div class="lead">Cada coleção é um cronograma separado. Trocar de coleção no seletor lá em cima muda o Painel e o Cronograma inteiros — nada de uma coleção se mistura com a outra.</div>

        <h4>A tela inicial: escolher a coleção</h4>
        <p>Ao entrar na plataforma, a primeira tela é <b>Coleções</b>. Cada cartão é uma coleção, com o retrato do cronograma dela: quanto já andou, quantas etapas estão em atraso, quantas estão sem data ou sem dono, e — o mais importante — como está a <b>liberação para o PCP</b>.</p>
        <p>Clique no cartão para entrar. Dali em diante, o Painel e o Cronograma mostram só aquela coleção. Para trocar, use o botão <b>⇄ trocar</b> no topo ou volte em <b>Coleções</b> no menu da esquerda.</p>
        <p style="font-size:12px;color:var(--muted)">O número no cartão é o mesmo do cronograma: ele já considera o efeito dos atrasos anteriores empurrando a cadeia, não só a data combinada.</p>

        <h4>O que é separado e o que é compartilhado</h4>
        <div class="man-leg">
          <div><b>Separado por coleção:</b> praticamente tudo — as etapas do cronograma, as datas, os donos, as promessas, os motivos de atraso, <b>as referências da grade</b>, as tarefas, as reuniões e todos os indicadores. A INVERNO pode estar atrasada sem contaminar a VERÃO.</div>
          <div><b>Compartilhado:</b> só as pessoas e o catálogo de fases. São do setor, não de uma coleção.</div>
          <div><b>Registros antigos</b>, feitos antes de existir mais de uma coleção, continuam aparecendo em todas — para não sumirem do radar de ninguém.</div>
        </div>

        <h4>Passo a passo para criar</h4>
        <div class="steps">
          <div class="step"><div class="st-t">1. Na tela <b>Coleções</b>, clique no cartão "Nova coleção"</div><div class="st-d">Ou use o botão "＋ nova" no topo do Painel e do Cronograma. Só o perfil admin vê essa opção.</div></div>
          <div class="step"><div class="st-t">2. Dê o nome e as duas datas mestras</div><div class="st-d">Nome como a empresa chama (ex.: "INVERNO 28"), a data em que a coleção começa e a data em que o mostruário precisa estar pronto. Se a coleção já existir por causa das referências, o sistema aproveita ela em vez de criar uma repetida.</div></div>
          <div class="step"><div class="st-t">3. Escolha de qual coleção copiar as etapas</div><div class="st-d">Use a coleção mais parecida e mais bem ajustada. Vêm junto: a lista de etapas, o macro tema de cada uma e a cadeia de quem depende de quem. Todo o ajuste que vocês já fizeram continua valendo.</div></div>
          <div class="step"><div class="st-t">4. Clique em "Criar coleção"</div><div class="st-d">Pronto. A nova coleção já fica selecionada, com as etapas no lugar e <b>sem datas</b>.</div></div>
        </div>
        <p><b>Por que nasce sem datas?</b> Porque prazo é decisão de reunião, não de sistema. Copiar as datas da coleção anterior seria repetir os mesmos atrasos. As datas que vocês definirem viram a <b>linha de base congelada</b> — e é contra ela que todo o resto vai ser medido o ano inteiro.</p>

        <h4>Os quatro passos que sustentam a coleção depois de criada</h4>
        <p>Criar é o fácil. O que faz a coleção andar é o que vem agora — e é o que faltou nas coleções passadas:</p>
        <div class="steps">
          <div class="step"><div class="st-t">1. Reunião de planejamento: defina o prazo de cada etapa</div><div class="st-d">Com o time todo junto, de trás para frente: a partir da entrega do mostruário, quanto tempo cada etapa precisa. Não esqueça o prazo dos fornecedores — foi o que derrubou o mostruário da última vez.</div></div>
          <div class="step"><div class="st-t">2. Confirme quem depende de quem</div><div class="st-d">Os predecessores vieram copiados, mas cada coleção tem suas particularidades. Abra as etapas e confira: se mudar alguma dependência, todo o cálculo de impacto muda junto.</div></div>
          <div class="step"><div class="st-t">3. Dê um dono a cada etapa</div><div class="st-d">Uma pessoa, não um setor. O filtro <b>Situação → Sem dono</b> mostra o que ainda falta atribuir.</div></div>
          <div class="step"><div class="st-t">4. Confirme a data que não pode furar</div><div class="st-d">Normalmente é a <b>liberação da coleção para o PCP</b>, porque ela está amarrada ao prazo de compra da matéria-prima. É contra ela que o sistema calcula a margem de manobra de todas as outras.</div></div>
        </div>

        <h4>Quando uma etapa fica sem data</h4>
        <p>Etapa sem data aparece tracejada na linha do tempo e com "sem data definida" na lista — e o sistema avisa que não consegue prever o que vem depois dela. Isso é proposital: melhor dizer "não sei" do que mostrar uma data bonita e falsa.</p>
        <p>É comum acontecer quando uma coleção é importada de uma planilha que não trazia todas as etapas. Elas entram assim mesmo, com data em aberto, para vocês preencherem — porque sem elas a cadeia se rompe no meio e a previsão da entrega para de funcionar.</p>

        <h4>Rodando duas coleções ao mesmo tempo</h4>
        <p>É o normal do setor: uma coleção fechando enquanto a outra começa. Na prática:</p>
        <div class="man-leg">
          <div>No ritual semanal, passe pelas duas — troque no seletor e olhe a faixa do topo de cada uma. Leva 5 minutos a mais e evita que a coleção "do futuro" seja descoberta atrasada.</div>
          <div>A coleção que está fechando costuma ter mais atraso; a que está começando é onde ainda dá para planejar bem. Preste mais atenção na que começa — é lá que o próximo mostruário se decide.</div>
          <div>Quando uma coleção termina, faça o retrospecto (seção anterior) antes de criar a próxima. As conclusões dele são exatamente o que deve mudar nos prazos da coleção nova.</div>
        </div>
      </section>

      <section class="man-sec" id="s-colecao">
        <h3><span class="nicon">❀</span> 7. Gestão da Coleção</h3>
        <div class="lead">O coração do sistema: a grade de ${nRef} referências (linhas) × ${nFase} fases (colunas).</div>
        <p>Cada linha é uma peça/referência; cada coluna é uma fase do desenvolvimento (Desenho, Modelagem, Pilotagem… até Produção de Catálogo). O cabeçalho de cada fase mostra a <b>data-limite</b> e os contadores: <b>✓ no prazo</b>, <b>! em atraso</b> e <b>… pendentes</b>.</p>
        <h4>Cadastrar uma referência na plataforma</h4>
        <p>Nem toda peça nasce na planilha. Quando entrar uma referência nova no meio da coleção, use o botão <b>＋ Nova referência</b>, no alto da grade. Os campos são os mesmos da planilha:</p>
        <div class="man-leg">
          <div><b>Código da referência</b> — o número da peça. Não pode repetir dentro da mesma coleção.</div>
          <div><b>Fluxo</b> — <i>coleção nova</i> passa por todas as fases; <i>continuada</i> entra só em cadastro de cores, liberação para o PCP e catálogo. É isso que faz a grade marcar "não se aplica" nas colunas certas.</div>
          <div><b>Linha</b> e <b>Família</b> — pode digitar ou escolher entre as que já existem.</div>
          <div><b>Estilista</b> — quem responde pela peça.</div>
          <div><b>Tipo de produto</b> — sutiã, calcinha, body, camisola… É o que descreve a peça de bate-pronto na grade.</div>
          <div><b>Tecido principal</b> — o tecido que define a peça. Vira indicador no Painel (veja abaixo), então vale preencher sempre.</div>
          <div><b>Cores</b> — clique nas cores da peça. Se faltar alguma, digite em "outra cor" e inclua: ela entra na lista e fica disponível para as próximas peças.</div>
          <div><b>Tamanhos</b> — clique nos tamanhos da grade da peça.</div>
          <div><b>Foto da peça</b> — clique na área tracejada e escolha a imagem. Ela é reduzida automaticamente antes de ser guardada e aparece como miniatura na grade.</div>
          <div><b>Rótulo da coleção</b> — o nome que o time usa na planilha (ex.: "INVERNO 27"). Serve para conferência e não muda a coleção em que a peça está.</div>
        </div>
        <p>As opções de tipo, cor, tamanho e tecido saem de <b>Cadastros do Produto</b>, no menu da esquerda. Lá o time mantém as listas — e quanto mais limpas elas estiverem, mais confiável fica o indicador.</p>
        <p><b>Por que o tecido principal importa:</b> no Painel há o quadro <b>"Referências por tecido principal"</b>, com quantas peças usam cada tecido e quanto isso representa da coleção. É o que responde "quanto da coleção depende de renda importada?" — e renda importada foi exatamente o que atrasou o último mostruário. Enquanto houver peças sem tecido informado, o quadro avisa: o percentual só fecha quando todas tiverem.</p>
        <p style="font-size:12px;color:var(--muted)">As fotos ficam guardadas neste navegador, junto com o resto dos dados. Em <b>⛃ Dados</b> há um medidor do espaço usado — se chegar perto do limite, exporte um backup.</p>
        <p>A referência entra na <b>coleção que estiver selecionada</b>, com todas as fases em branco. As datas de cada fase você registra depois, clicando nas células da grade, como sempre. Para corrigir os dados de uma peça, use o <b>✎</b> ao lado do código.</p>
        <p style="font-size:12px;color:var(--muted)">Referência cadastrada aqui não se perde quando chega planilha nova — nem ela, nem as datas de fase já registradas nela. Se um dia a planilha passar a trazer o mesmo código, a planilha manda e o cadastro manual sai de cena, para não duplicar a peça.</p>

        <h4>O que cada cor da célula significa</h4>
        <div class="man-leg">
          <span><i class="sw" style="background:var(--ok-bg)"></i> Concluída no prazo</span>
          <span><i class="sw" style="background:var(--warn-bg)"></i> Concluída com atraso</span>
          <span><i class="sw" style="background:var(--late-bg)"></i> Em atraso</span>
          <span><i class="sw" style="background:#f6f4ef"></i> Pendente</span>
          <span><i class="sw" style="background:repeating-linear-gradient(45deg,#f3f1ec 0 4px,#fbfaf7 4px 8px)"></i> Não se aplica</span>
        </div>
        <h4>Registrar a conclusão de uma fase</h4>
        <div class="steps">
          <div class="step"><div class="st-t">Clique na célula da referência × fase</div><div class="st-d">Ex.: a célula de "Modelagem" da referência 503151.</div></div>
          <div class="step"><div class="st-t">Informe a data de conclusão (e uma observação, se quiser)</div><div class="st-d">A data e <b>o seu nome</b> ficam gravados — é a evidência que substitui o caderno.</div></div>
          <div class="step"><div class="st-t">Salve</div><div class="st-d">A célula muda de cor e os contadores no topo se atualizam na hora.</div></div>
        </div>
        <h4>Filtrar e buscar</h4>
        <ul>
          <li>Filtre por <b>linha</b> (FASHION, LUXE…), <b>família</b> (KISS ME, LUMINA…), <b>estilista</b>, <b>fluxo</b> (coleção nova × continuados) ou só o que está <b>em atraso</b>.</li>
          <li>Use a busca para achar uma referência pelo código.</li>
        </ul>
        <div class="callout ouro">Todo o cronograma da coleção é de <b>responsabilidade da Joice</b> gerenciar — é ela quem sinaliza datas, prazos e cobranças em cada fase.</div>
        <div class="callout atencao">A data-limite de cada fase pode ser editada pelo perfil de administração: clique no selo "limite…" no cabeçalho da coluna. Algumas fases ainda estão "sem limite" — defina-as para que o cálculo de atraso funcione nelas.</div>
      </section>

      <section class="man-sec" id="s-tarefas">
        <h3><span class="nicon">☰</span> 8. Quadro de Tarefas</h3>
        <div class="lead">O quadro que substitui o caderno: toda demanda vira um cartão com dono e prazo.</div>
        <p>São três colunas: <b>Pendente → Em andamento → Concluída</b>. Cartões com borda rosé estão com o prazo vencido.</p>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "＋ Nova tarefa"</div><div class="st-d">Saiu da reunião, virou cartão — na frente de todos.</div></div>
          <div class="step"><div class="st-t">Descreva, escolha o responsável, o prazo e a ata de origem</div><div class="st-d">Toda tarefa informa de <b>qual reunião (ata)</b> ela nasceu — rastreabilidade e governança. Se não veio de reunião, deixe "Avulsa".</div></div>
          <div class="step"><div class="st-t">Mova o cartão com ◀ e ▶</div><div class="st-d">Conforme a tarefa avança até "Concluída".</div></div>
        </div>
        <div class="callout dica">Filtre por <b>responsável</b>, por <b>prazo até</b> uma data, ou por <b>ata de reunião</b> (vê só as tarefas que saíram daquela reunião). Marque <b>"só as minhas"</b> para ver sua carga. O cartão mostra a ata de origem (↩ Ata dd/mm) ou "avulsa".</div>
      </section>

      <section class="man-sec" id="s-rituais">
        <h3><span class="nicon">✎</span> 9. Rituais &amp; Atas</h3>
        <div class="lead">As reuniões do setor, com pauta automática e atas em 24h.</div>
        <p>No topo ficam os 4 rituais oficiais. Para registrar uma reunião:</p>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "＋ registrar reunião" no ritual desejado</div><div class="st-d">Ex.: o Ritual semanal de cronograma, toda segunda.</div></div>
          <div class="step"><div class="st-t">Gere a pauta do cronograma</div><div class="st-d">No ritual semanal e no reporte à Diretoria, o botão <b>"⟳ gerar do cronograma"</b> escreve a pauta sozinho, em ordem de prioridade: o que está em atraso (com o dono de cada etapa), o que vence em 7 dias, o que está sem margem e o que está sem data. Revise e ajuste antes de publicar — a pauta é um ponto de partida, não a ata.</div></div>
          <div class="step"><div class="st-t">Marque a presença e escreva a ata</div><div class="st-d">Anote decisões e encaminhamentos.</div></div>
          <div class="step"><div class="st-t">Transforme os encaminhamentos em tarefas</div><div class="st-d">Use o botão <b>"＋ tarefa desta reunião"</b>: a tarefa já nasce vinculada à <b>ata de origem</b>. A gestão e a cobrança acontecem no <b>Quadro de Tarefas</b>.</div></div>
          <div class="step"><div class="st-t">Clique em "Publicar ata"</div><div class="st-d">O sistema cronometra: <b>ata publicada em até 24h</b> conta para a meta de 100%.</div></div>
        </div>
        <div class="callout dica">As cobranças do que foi combinado são geridas como <b>tarefas</b> no Quadro de Tarefas — com responsável, prazo e a ata de origem para rastreabilidade.</div>
      </section>

      <section class="man-sec" id="s-dados">
        <h3><span class="nicon">⛃</span> 10. Dados & Backup</h3>
        <div class="lead">Importante até a plataforma migrar para a nuvem (próxima fase do projeto).</div>
        <p>Por enquanto, os dados ficam salvos <b>neste navegador, neste computador</b>. Por isso a <b>máquina da Joice é a fonte oficial da verdade</b>. No botão <b>⛃ Dados</b> no topo você pode:</p>
        <ul>
          <li><b>Exportar backup (JSON)</b> — faça toda sexta e guarde no Drive. O sistema avisa com uma faixa quando o último backup tem mais de 7 dias.</li>
          <li><b>Exportar planilha (Excel)</b> — gera um arquivo .xlsx com a coleção, cronograma, tarefas e cobranças (útil para enviar à diretoria).</li>
          <li><b>Importar backup</b> — recupera os dados de um arquivo JSON (substitui os atuais, com confirmação).</li>
          <li><b>Restaurar dados originais</b> — volta tudo para a planilha original (use com cuidado).</li>
        </ul>
        <div class="callout atencao">Quando chega uma <b>versão mais recente da planilha</b>, aparece uma faixa verde no topo: clique em "Atualizar coleção". Isso troca o cronograma e a coleção pelos dados novos do Excel e <b>mantém</b> suas tarefas, atas e cobranças.</div>
      </section>

      <section class="man-sec" id="s-faq">
        <h3><span class="nicon">❓</span> 11. Perguntas frequentes</h3>
        <div class="faq"><div class="q">Uma fase teve 2 ou 3 tentativas (ex.: 1ª, 2ª, 3ª modelagem). Como registro?</div><div class="a">Clique na célula da fase: cada ocorrência é uma linha com data e observação. Use <b>＋ adicionar evento</b> para incluir a 2ª, 3ª… A célula mostra a data mais recente e um contador (ex.: <b>3×</b>); passando o mouse, você vê todas as datas.</div></div>
        <div class="faq"><div class="q">Errei uma data numa célula. Como corrijo?</div><div class="a">Clique na célula de novo e ajuste a data do evento, remova um evento pelo ✕, ou use "Limpar tudo" para zerar a célula.</div></div>
        <div class="faq"><div class="q">Por que algumas fases mostram "pendente" e não "em atraso"?</div><div class="a">Porque ainda não têm data-limite definida. O perfil de administração define o limite clicando no selo "sem limite" no cabeçalho da coluna.</div></div>
        <div class="faq"><div class="q">A equipe pode usar pelo celular?</div><div class="a">Sim. O layout se adapta; use o botão ☰ no topo para abrir o menu. Ideal para atualizar uma conclusão no chão de fábrica.</div></div>
        <div class="faq"><div class="q">O Cairo consegue editar sem querer?</div><div class="a">Não. O perfil dele é de leitura — os botões de edição nem aparecem.</div></div>
        <div class="faq"><div class="q">Perdi o que eu tinha feito. E agora?</div><div class="a">Se você exporta backup com frequência, é só usar "Importar backup". Por isso o hábito de exportar toda sexta é tão importante — até a versão na nuvem ficar pronta.</div></div>
        <div class="faq"><div class="q">Como cancelo uma referência que saiu da coleção?</div><div class="a">Na Gestão da Coleção, clique no <b>✕</b> ao lado do código da referência, escolha o motivo (categoria) e escreva a justificativa. A peça fica riscada, sai das contagens de atraso e dos indicadores, e o cancelamento entra no <b>Histórico de cancelamentos</b> (com autor, data e motivo). Esse poder é exclusivo da Joice. Para reverter, clique no <b>↩</b> e justifique a reativação — ambos ficam no histórico.</div></div>
        <div class="faq"><div class="q">Como reabro este manual?</div><div class="a">Pelo item <b>📖 Manual de Uso</b> no menu lateral, ou pelo botão <b>📖 Manual</b> no topo de qualquer página.</div></div>
      </section>

      <p style="text-align:center;color:var(--muted);font-size:11.5px;margin-top:6px">PWR Gestão · Sistema de Gestão de Cronograma da Liebe · uso interno</p>
    </div>
  </div>`;

/* A foto vive no localStorage junto com o resto: guardar o arquivo original
   estouraria o limite em poucas peças. Reduzimos para ~320px antes de gravar. */
function fotoReduzida(file,maxPx,q){
  return new Promise((ok,erro)=>{
    if(!file||!/^image\//.test(file.type))return erro(new Error('Escolha um arquivo de imagem.'));
    const fr=new FileReader();
    fr.onerror=()=>erro(new Error('Não consegui ler o arquivo.'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>erro(new Error('Arquivo de imagem inválido.'));
      img.onload=()=>{
        const esc_=Math.min(1,maxPx/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*esc_)),h=Math.max(1,Math.round(img.height*esc_));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        ok(cv.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

// Lê os inputs do modal de volta para cellEdit.rows (preservando id/by/at por posição).
function syncCellEdit(){
  if(!cellEdit)return;
  cellEdit.rows=[...document.querySelectorAll('.ev-row')].map(el=>{
    const prev=cellEdit.rows[+el.dataset.i]||{};
    return {id:prev.id,by:prev.by,at:prev.at,date:el.querySelector('.ev-date').value,notes:el.querySelector('.ev-note').value.trim()};
  });
}

function chipsPredecessores(){
  const sel=procEdit.predecessores;
  if(!sel.length)return'<div class="pred-vazio">Nenhum — esta etapa <b>roda em paralelo</b> e nenhum atraso de fora a empurra.</div>';
  return [...sel].sort((a,b)=>a-b).map(n=>{
    const q=procsCol().find(x=>x.seq===n);
    return `<span class="chip on">${n}. ${esc(q?q.name:'—')}
      <button data-action="proc-pred-del" data-v="${n}" title="deixar de depender desta etapa">✕</button></span>`}).join('');
}
// Só oferece etapas que não criam dependência circular.
function opcoesPredecessor(seq){
  const sel=procEdit.predecessores;
  const livres=procsOrdenados().filter(x=>x.seq!==seq&&!sel.includes(x.seq)&&!criariaCiclo(seq,x.seq));
  if(!livres.length)return'<option value="">— nenhuma etapa disponível —</option>';
  return'<option value="">— escolha a etapa anterior —</option>'+
    livres.map(x=>`<option value="${x.seq}">${x.seq}. ${esc(x.name)}</option>`).join('');
}

/* Resposta à pergunta do Cairo, em português de chão de fábrica. */
function htmlSimulacao(seq,dias,hoje){
  const r=simularAtraso(seq,dias,hoje);
  if(r.jaConcluida)return'<span style="color:var(--muted)">Esta etapa já foi concluída — não há o que simular.</span>';
  // aviso sobre trechos da cadeia que não dá para calcular (vale em qualquer caso)
  const semData=r.semDataNaCadeia.length?`<div style="color:var(--warn);margin-top:6px;font-size:11.5px">Parte da cadeia à frente passa por
      ${r.semDataNaCadeia.map(x=>'<b>#'+x.seq+' '+esc(x.name)+'</b>').join(' · ')},
      ${r.semDataNaCadeia.length>1?'que estão sem data':'que está sem data'} — o alcance real pode ir além do que aparece aqui.</div>`:'';
  if(!r.empurra){
    if(!r.temSucessores)
      return'<b style="color:var(--ok)">Não empurra nenhuma outra etapa.</b> Nada depende dela, então o atraso fica contido aqui.';
    // a folga explica mais casos que a falta de data: checar primeiro, senão a
    // mensagem culpa o dado faltante quando na verdade havia margem de sobra
    const lim=limiarImpacto(seq,hoje);
    if(lim!=null)
      return`<b style="color:var(--ok)">Com ${dias} dia(s), nada se move ainda.</b> Esta etapa só começa a empurrar a partir de
        <b>${lim} dia(s)</b> de atraso — a margem dela é de <b>${lim-1} dia(s)</b>.${semData}`;
    if(r.semDataNaCadeia.length)
      return`<b style="color:var(--warn)">Não dá para calcular o impacto.</b> Esta etapa empurra outras, mas a cadeia à frente passa por
        ${r.semDataNaCadeia.map(x=>'<b>#'+x.seq+' '+esc(x.name)+'</b>').join(' · ')},
        ${r.semDataNaCadeia.length>1?'que estão sem data':'que está sem data'}.
        <br>${r.semDataNaCadeia.length>1?'Defina as datas dessas etapas':'Defina a data dessa etapa'} para enxergar até onde o atraso chega.`;
    return`<b style="color:var(--ok)">Com ${dias} dia(s), nada se move.</b> Quem vem depois está sendo segurado por outra etapa, não por esta — há bastante margem aqui.`;
  }
  const linhas=r.afetados.map(a=>`<div>#${a.seq} ${esc(a.name)} <b>+${a.dias}d</b> <span style="color:var(--muted)">${fmtBR(a.de)} → ${fmtBR(a.para)}</span></div>`).join('');
  const pcp=r.pcp>0?`<br>Atrasa a <b>liberação para o PCP em ${r.pcp} dia(s)</b>.`
                   :'<br>Não mexe na liberação para o PCP.';
  return `Empurra <b>${r.afetados.length} etapa(s)</b>${r.temas.length?' em: '+esc(r.temas.join(', ')):''}.${pcp}
    <div class="cadeia">${linhas}</div>${semData}`;
}

function criarColecao(nome,ini,fim,modeloId){
  const base=db.macro_processes.filter(p=>p.collection_id===modeloId).sort((a,b)=>a.seq-b.seq);
  // reaproveita a coleção que já existe pelas referências (sem cronograma), se houver
  const existente=db.collections.find(c=>c.name.trim().toLowerCase()===nome.trim().toLowerCase());
  const cid=existente?existente.id:('col-'+slugSimples(nome)+'-'+Date.now().toString(36).slice(-4));
  const modelo=db.collections.find(c=>c.id===modeloId);
  // herda o marco do PCP; se o modelo não o declarar, acha pela própria etapa
  const seqPcpModelo=(modelo&&modelo.marcos&&modelo.marcos.liberacao_pcp_seq)
    ||(base.find(p=>/libera/i.test(p.name)&&/pcp/i.test(p.name))||{}).seq||null;
  commit(x=>{
    const dados={name:nome,status:'em_andamento',start_date:ini||null,end_date:fim||null,
      marcos:{entrega_mostruario:fim||null,liberacao_pcp_seq:seqPcpModelo},
      created_at:agoraIso(),created_by:(currentUser()||{}).id||null,copiada_de:modeloId};
    const alvo=x.collections.find(c=>c.id===cid);
    if(alvo)Object.assign(alvo,dados);else x.collections.push({id:cid,...dados});
    base.forEach(p=>{
      x.macro_processes.push({
        id:cid+'-proc-'+String(p.seq).padStart(2,'0'),collection_id:cid,seq:p.seq,name:p.name,
        owner_team:p.owner_team||null,macro_tema:p.macro_tema||null,
        predecessores:Array.isArray(p.predecessores)?[...p.predecessores]:[],
        // datas em aberto: o prazo é decidido na reunião de planejamento
        start_date:null,end_date:null,inicio_real:null,fim_real:null,completed_at:null,
        percent_complete:0,responsavel_user_id:null,motivo_atraso:null,promessas:[],
        observacoes:null,created_at:agoraIso(),created_by:(currentUser()||{}).id||null});
    });
  });
  setColecaoAtiva(cid);
  return {cid,n:base.length};
}
function slugSimples(t){return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')||'colecao'}

// O navegador guarda uns 5 MB por site. Com fotos das peças isso passa a importar,
// então o uso fica visível antes de virar erro de "armazenamento cheio".
function usoArmazenamento(){
  const bytes=JSON.stringify(db).length;
  const fotos=(db.references||[]).filter(r=>r.foto).length;
  const bytesFotos=(db.references||[]).reduce((t,r)=>t+(r.foto?r.foto.length:0),0);
  const limite=5*1024*1024;
  return{mb:(bytes/1048576).toFixed(1),pct:Math.min(100,Math.round(bytes/limite*100)),
    fotos,mbFotos:(bytesFotos/1048576).toFixed(1)};
}
function mDados(){
  const u=usoArmazenamento();
  const cls=u.pct>=85?'s-late':u.pct>=60?'s-warn':'s-ok';

    localStorage.setItem(LS_SESS,JSON.stringify({user_id:u.id,at:agoraIso()}));

    location.hash=colecoesComCronograma().length>1?'#/colecoes':'#/dashboard';render();

  'menu-dados':()=>mDados(),
  'seed-apply':()=>{if(!can('write')){toast('Seu perfil é somente leitura.');return}applyNewSeed()},
  'seed-dismiss':()=>dismissSeed(),
  'man-go':d=>{const el=document.getElementById(d.target);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},

  'kpi-launch':()=>mKpi(),

  'kpi-save':()=>{
    const mes=$('#m-kpi-mes').value,rnc=$('#m-kpi-rnc').value,otif=$('#m-kpi-otif').value;
    if(!mes){toast('Informe o mês.');return}
    commit(d=>{
      const put=(k,v)=>{if(v==='')return;const e=d.kpi_entries.find(x=>x.kpi_key===k&&x.period===mes);
        if(e){e.value=Number(v)}else d.kpi_entries.push({id:uuid(),kpi_key:k,period:mes,value:Number(v),notes:null,created_at:agoraIso(),created_by:currentUser().id})};
      put('rnc',rnc);put('otif_mp',otif);
    });closeModal();toast('Indicadores salvos.');
  },
  /* cronograma */
  'cr-view':d=>{ST.cronograma.view=d.v;render()},
  'cr-sel':d=>{const c=ST.cronograma,s=Number(d.seq)||null;
    c.sel=(c.sel===s)?null:s;
    // selecionar uma etapa já aproxima nela: é o drill down natural
    if(c.sel&&c.zoom!=='mes'){const p=procsCol().find(x=>x.seq===c.sel),pr=projetarCronograma(hojeStr())[c.sel];
      c.foco=(pr&&pr.ini)||p.start_date||c.foco}

  'cr-zoom':d=>{const c=ST.cronograma;c.zoom=d.z;if(!c.foco)c.foco=focoPadrao();render()},
  'cr-drill':d=>{const c=ST.cronograma,i=NIVEIS.indexOf(c.zoom||'mes');
    const j=d.dir==='in'?Math.min(i+1,NIVEIS.length-1):Math.max(i-1,0);
    c.zoom=NIVEIS[j];if(!c.foco)c.foco=focoPadrao();render()},
  'cr-nav':d=>{const c=ST.cronograma,passo=NIVEL_PASSO[c.zoom||'mes']*Number(d.d);
    c.foco=addDias(c.foco||focoPadrao(),passo);render()},
  'cr-hoje':()=>{ST.cronograma.foco=hojeStr();render()},

    toast('Você está na coleção '+((db.collections.find(c=>c.id===d.id)||{}).name||''))},

    const nome=$('#m-cn-nome').value.trim(),ini=$('#m-cn-ini').value,fim=$('#m-cn-fim').value,mod=$('#m-cn-modelo').value;
    if(!nome){toast('Dê um nome à coleção.');return}

    const eu=currentUser();

/* ---------------------------- export Excel (SheetJS lazy + fallback CSV) ---------------------------- */
function gridLinhas(){
  const hoje=hojeStr();
  const head=['#','COLEÇÃO','LINHA','FAMÍLIA','ESTILISTA','REFERÊNCIA','TIPO DE PRODUTO','TECIDO PRINCIPAL','CORES','TAMANHOS','FLUXO','SITUAÇÃO',...db.phases.map(p=>p.name)];
  const rows=refsCol().map((r,i)=>{const cancelada=r.status==='cancelada';
    return [i+1,r.collection_name,r.line,r.family,r.stylist,r.code,
    r.tipo_produto||'',r.tecido_principal||'',(r.cores||[]).join(', '),(r.tamanhos||[]).join(', '),
    r.flow_type,cancelada?'CANCELADA':'Ativa',
    ...db.phases.map(ph=>{if(cancelada)return'';const s=statusCelula(r,ph,hoje);
      return s.k==='na'?'N/A':(s.k==='done'||s.k==='donelate')?s.date+(s.n>1?` (${s.n}x)`:''):s.k==='late'?s.days+' dias em atraso':''})]});
  return[head,...rows];
}
function exportExcel(){
  const fim=()=>{localStorage.setItem(LS_EXP,agoraIso());render()};
  const run=()=>{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gridLinhas()),'Gestão da Coleção');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['#','Processo','Equipe','Início','Prazo','% Avanço','Concluído em'],
      ...procsCol().map(p=>[p.seq,p.name,p.owner_team||'',p.start_date||'',p.end_date||'',(p.percent_complete||0)+'%',p.completed_at||''])]),'Cronograma');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Tarefa','Responsável','Prazo','Status','Detalhes'],
      ...tasksCol().map(t=>[t.title,ix.userById[t.assignee_user_id]?.name||'',t.due_date||'',t.status,t.description||''])]),'Tarefas');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Cobrado','Por','Assunto','Prazo','Evidência','Status'],
      ...db.charges.map(c=>[ix.userById[c.charged_user_id]?.name||'',ix.userById[c.charged_by]?.name||'',c.subject,c.due_date||'',c.evidence||'',c.status])]),'Cobranças');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Referência','Ação','Categoria','Justificativa','Por','Data/Hora'],
      ...[...(db.reference_log||[])].sort((a,b)=>(b.at||'').localeCompare(a.at||'')).map(e=>[e.ref_code,e.action,e.category||'',e.reason||'',ix.userById[e.by]?.name||'',e.at?new Date(e.at).toLocaleString('pt-BR'):''])]),'Cancelamentos');
    const evLinhas=[['Referência','Fase','Evento','Data','Observação','Por']];
    refsCol().forEach(r=>db.phases.forEach(ph=>{cellEvents(ix.rpByKey[r.id+'|'+ph.id]).forEach((e,j)=>
      evLinhas.push([r.code,ph.name,(j+1)+'ª',e.date,e.notes||'',ix.userById[e.by]?.name||'']))}));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(evLinhas),'Eventos por fase');
    XLSX.writeFile(wb,'liebe-gestao-colecao-'+hojeStr()+'.xlsx');toast('Excel exportado.');fim();
  };
  if(window.XLSX){run();return}
  toast('Carregando exportador…');
  const s=document.createElement('script');
  s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  s.onload=run;
  s.onerror=()=>{ // sem internet: CSV
    const csv=gridLinhas().map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    baixar(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),'liebe-gestao-colecao-'+hojeStr()+'.csv');
    toast('Sem internet — exportado em CSV.');fim();
  };
  document.head.appendChild(s);
}
$('#file-import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const nd=JSON.parse(rd.result);
    if(!nd.references||!nd.phases){toast('Arquivo inválido.');return}
    if(!confirm(`Importar backup de ${nd.exported_at?new Date(nd.exported_at).toLocaleString('pt-BR'):'?'} — ${nd.references.length} referências, ${nd.tasks.length} tarefas, ${nd.rituals.length} reuniões?\nIsto SUBSTITUI os dados atuais.`))return;
    delete nd.exported_at;db=migrate(nd);saveDbNow();closeModal();render();toast('Backup importado ✓');
  }catch(err){toast('Erro ao ler o arquivo.')}};
  rd.readAsText(f);e.target.value='';
});

  {el:'#col-filtros',t:'Filtre como na planilha — só que instantâneo',p:'Por linha (FASHION, LUXE…), família (KISS ME, LUMINA…), estilista, fluxo (nova × continuada) ou só o que está em atraso. A busca encontra qualquer referência pelo código.'},
  {el:'#col-grid',t:'O coração do sistema',p:'Cada linha é uma referência; cada coluna, uma fase. Célula verde = concluída no prazo; âmbar = concluída com atraso; rosé = atrasada; hachurada = não se aplica àquele fluxo. Os contadores no topo somam ✓ no prazo, ! em atraso e … pendentes.'},
  {el:'#col-grid',t:'Cada fase aceita vários eventos',p:'Clique numa célula para registrar as ocorrências da fase: 1ª modelagem, 2ª, 3ª… cada uma com sua data e observação. O número no canto (ex.: 3×) mostra quantos eventos há, e o status usa sempre a data mais recente. Tudo guarda QUEM registrou — substitui o caderno e vira evidência.'},
  {el:'[data-action="hist-cancel"]',t:'Cancelar referências (só a Joice)',p:'Quando uma referência sai da coleção, a Joice clica no ✕ ao lado do código e informa o motivo. A peça fica riscada, sai das contagens de atraso, e o cancelamento (com autor, data e justificativa) entra no Histórico — rastreabilidade total para a governança. Reativar segue o mesmo caminho.'}],
 '#/tarefas':[
  {el:'#t-filtros',t:'O quadro que substitui o caderno',p:'Toda demanda vira um cartão com responsável, prazo e a ata de reunião de origem. Filtre por pessoa, por prazo até uma data, ou por ata de reunião (mostra só as tarefas que saíram daquela reunião). "só as minhas" mostra a sua carga.'},
  {el:'#kanban',t:'Três colunas, zero dúvida',p:'Pendente → Em andamento → Concluída. Os botões ◀ ▶ movem o cartão. Cartão com borda rosé = prazo vencido — é o primeiro assunto do briefing diário.'},
  {el:'#btn-nova-tarefa',t:'Saiu da reunião, virou cartão',p:'Encaminhamento sem cartão é encaminhamento perdido. Crie a tarefa na hora, na frente de todos — transparência é o que faz o quadro funcionar.'}],
 '#/rituais':[
  {el:'#rit-cadencia',t:'A batida do setor',p:'Os 4 rituais oficiais: semanal de cronograma (segunda, 60 min), briefing diário (15 min), batimento quinzenal com as interfaces e reporte mensal à Diretoria.'},
  {el:'#rit-lista',t:'Pauta pronta em um clique',p:'Ao registrar a reunião de segunda, a pauta nasce preenchida com os atrasos do cronograma, fases críticas e tarefas vencidas. Reunião enxuta, sem burocracia.'},
  {el:'#rit-lista',t:'Ata em 24 horas',p:'Depois da reunião, escreva a ata e clique em "Publicar". O sistema cronometra: ata publicada em até 24h conta para a meta de 100%. Os encaminhamentos viram tarefas (botão “＋ tarefa desta reunião”), já com a ata de origem registrada.'}],
};
let tourState=null;
function startTour(route){
  const steps=TOURS[route];if(!steps||!steps.length)return;
  tourState={steps,i:0,route};
  $('#tour').classList.add('open');
  $('#tour').innerHTML='<div class="tour-spot"></div><div class="tour-tip"></div>';
  tourStep(0);
}
function tourStep(i){
  const st=tourState;if(!st)return;
  if(i<0)i=0;
  if(i>=st.steps.length){endTour();return}
  st.i=i;
  const s=st.steps[i];
  let el=null;
  for(const sel of s.el.split(',')){el=document.querySelector(sel.trim());if(el)break}
  if(!el){tourStep(i+1);return}
  el.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{
    const r=el.getBoundingClientRect();
    const spot=$('#tour .tour-spot'),tip=$('#tour .tour-tip');
    spot.style.cssText=`left:${r.left-8}px;top:${r.top-8}px;width:${r.width+16}px;height:${r.height+16}px;border-radius:14px;box-shadow:0 0 0 9999px rgba(26,26,26,.55)`;
    tip.innerHTML=`<h4>${s.t}</h4><p>${s.p}</p>
      <div class="ta"><span class="step-n">${i+1} de ${st.steps.length}</span>
      ${i>0?'<button class="btn btn-g btn-sm" data-action="tour-prev">← anterior</button>':''}
      <button class="btn btn-p btn-sm" data-action="tour-next">${i===st.steps.length-1?'Concluir ✓':'próximo →'}</button>
      <button class="btn btn-g btn-sm" data-action="tour-end">fechar</button></div>`;
    const tw=340,th=tip.offsetHeight||180,vw=innerWidth,vh=innerHeight;
    let tx=r.left,ty=r.bottom+14;
    if(ty+th>vh-20)ty=Math.max(16,r.top-th-14);
    if(tx+tw>vw-16)tx=Math.max(16,vw-tw-16);
    tip.style.cssText=`left:${tx}px;top:${ty}px`;
  },330);
}
function endTour(){
  if(tourState){const seen=JSON.parse(localStorage.getItem(LS_TOUR)||'{}');seen[tourState.route]=true;localStorage.setItem(LS_TOUR,JSON.stringify(seen))}
  tourState=null;$('#tour').classList.remove('open');$('#tour').innerHTML='';
}
ACTIONS['tour-next']=()=>tourStep(tourState.i+1);
ACTIONS['tour-prev']=()=>tourStep(tourState.i-1);
ACTIONS['tour-end']=()=>endTour();
function autoTour(route){
  if(!TOURS[route])return;
  const seen=JSON.parse(localStorage.getItem(LS_TOUR)||'{}');
  if(seen[route])return;
  setTimeout(()=>startTour(route),650);
}

/* ---------------------------- delegação global ---------------------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');
  if(!t)return;
  if(t.id==='modal'&&e.target!==t)return;
  const fn=ACTIONS[t.dataset.action];
  if(fn)fn(t.dataset,t,e);
});
document.addEventListener('change',e=>{
  const f=e.target.dataset.filter,tf=e.target.dataset.tfilter,cf=e.target.dataset.cfilter;
  if(f){ST.colecao[f]=e.target.value;render()}
  if(cf){ST.cronograma[cf]=e.target.value;render()}
  if(e.target.dataset.colsel){setColecaoAtiva(e.target.value);render()}
  if(e.target.dataset.fotoinput){const f=e.target.files&&e.target.files[0];if(!f)return;
    fotoReduzida(f,320,.72).then(d=>{refEdit.foto=d;$('#m-rf-foto').innerHTML=htmlFoto()})
      .catch(err=>toast(err.message||'Não consegui usar essa imagem.'));
    e.target.value='';}
  if(tf){ST.tarefas[tf]=e.target.type==='checkbox'?e.target.checked:e.target.value;render()}
});
document.addEventListener('input',e=>{
  if(e.target.dataset.filter==='busca'){clearTimeout(vColecao._t);vColecao._t=setTimeout(()=>{ST.colecao.busca=e.target.value;const sc=$('#col-grid')?.scrollLeft;render();const g=$('#col-grid');if(g&&sc)g.scrollLeft=sc;const inp=document.querySelector('[data-filter="busca"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}},350)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();endTour()}
  if(e.key==='Enter'&&$('#pin')&&document.activeElement===$('#pin'))ACTIONS['do-login']();
});
window.addEventListener('hashchange',()=>{if(isMobile())setNav(true);render()});
window.addEventListener('resize',()=>{if(tourState)tourStep(tourState.i)});

/* ---------------------------- init ---------------------------- */
loadDb();
render();
</script>
