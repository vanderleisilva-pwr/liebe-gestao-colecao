<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Liebe · Gestão de Coleção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================ IDENTIDADE LIEBE ============================ */
:root{
  --rose:#b76b79; --rose-dark:#9e5462; --rose-soft:#c4838f; --rose-pale:#e9cdd2;
  --cream:#faf9f5; --blush:#f3ebe9; --beige:#d4d0be; --ink:#1a1a1a;
  --muted:#8a8378; --line:#e7e0d8; --white:#ffffff;
  --ok:#4e8a63; --ok-bg:#e9f2ec; --warn:#b8862e; --warn-bg:#f7efdd;
  --late:#9e5462; --late-bg:#f5e4e7; --na:#aaa49a;
  --shadow:0 2px 14px rgba(26,26,26,.07); --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Montserrat',-apple-system,'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--rose-pale);border-color:var(--rose-soft)}
a{color:var(--rose-dark)}
h1,h2,h3{font-weight:600}
::-webkit-scrollbar{height:10px;width:10px}::-webkit-scrollbar-thumb{background:var(--beige);border-radius:6px}::-webkit-scrollbar-track{background:transparent}

/* ============================ LOGIN ============================ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--blush) 0%,var(--cream) 55%);padding:24px}
.login-card{background:var(--white);border-radius:20px;box-shadow:var(--shadow);padding:40px 36px;max-width:680px;width:100%}
.brand{font-size:34px;font-weight:300;letter-spacing:.35em;text-transform:lowercase;color:var(--ink);text-align:center}
.brand b{color:var(--rose);font-weight:300}
.brand-sub{text-align:center;color:var(--rose-dark);font-size:12px;letter-spacing:.22em;text-transform:uppercase;margin:6px 0 26px}
.login-note{background:var(--blush);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:22px}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.user-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;transition:.15s;background:var(--white)}
.user-card:hover{border-color:var(--rose);transform:translateY(-2px)}
.user-card.sel{border-color:var(--rose);background:var(--blush)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;margin:0 auto 8px}
.user-card .nm{font-weight:600;font-size:13px}
.user-card .jt{font-size:11px;color:var(--muted);margin-top:2px}
.role-chip{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;margin-top:6px;background:var(--blush);color:var(--rose-dark)}
.pin-row{display:flex;gap:10px;margin-top:22px;align-items:center;justify-content:center}
.pin-row input{max-width:140px;text-align:center;letter-spacing:.3em;font-size:16px}

/* ============================ SHELL ============================ */
.shell{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;height:100vh;z-index:40;transition:transform .2s;overflow:hidden}
.side-brand{padding:22px 20px 14px;text-align:center;border-bottom:1px solid var(--line);flex-shrink:0;position:relative}
.side-brand .brand{font-size:24px}
.side-brand .brand-sub{margin:4px 0 0;font-size:10px}
.nav{padding:14px 10px;flex:1 1 auto;overflow-y:auto;min-height:0}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500;font-size:13.5px;margin-bottom:3px}
.nav a:hover{background:var(--blush)}
.nav a.on{background:var(--rose);color:#fff}
.nav a .ic{width:20px;text-align:center;font-size:15px}
.regra-ouro{margin:10px;background:var(--blush);border:1px dashed var(--rose-soft);border-radius:12px;padding:12px;font-size:11.5px;color:var(--rose-dark);text-align:center;line-height:1.6;flex-shrink:0}
.regra-ouro b{display:block;letter-spacing:.12em;font-size:10px;text-transform:uppercase;margin-bottom:4px;color:var(--rose)}
.side-user{padding:12px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.side-user .avatar{width:34px;height:34px;font-size:13px;margin:0}
.side-user .nm{font-size:12.5px;font-weight:600}
.side-user .jt{font-size:10.5px;color:var(--muted)}
.side-user button{margin-left:auto;color:var(--muted);font-size:11px;text-decoration:underline}
.main{flex:1;margin-left:232px;display:flex;flex-direction:column;min-width:0;transition:margin-left .2s}
/* estado recolhido (vale para desktop e mobile) */
body.nav-collapsed .sidebar{transform:translateX(-100%)}
body.nav-collapsed .main{margin-left:0}
body.nav-collapsed .burger{display:inline-flex;align-items:center;justify-content:center}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar h1{font-size:17px;font-weight:600}
.topbar .sub{font-size:11.5px;color:var(--muted)}
.topbar .sp{flex:1}
.burger{display:none;font-size:20px;padding:2px 10px;border-radius:8px;color:var(--rose-dark)}
.burger:hover{background:var(--blush)}
.side-hide{position:absolute;top:14px;right:12px;width:30px;height:30px;border-radius:8px;background:var(--blush);color:var(--rose-dark);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.side-hide:hover{background:var(--rose);color:#fff}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}

/* ============================ COMPONENTES ============================ */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-weight:600;font-size:12.5px;transition:.15s;white-space:nowrap}
.btn-p{background:var(--rose);color:#fff}.btn-p:hover{background:var(--rose-dark)}
.btn-o{border:1.5px solid var(--rose);color:var(--rose-dark);background:var(--white)}.btn-o:hover{background:var(--blush)}
.btn-g{border:1px solid var(--line);color:var(--muted);background:var(--white)}.btn-g:hover{border-color:var(--beige);color:var(--ink)}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:8px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h3{font-size:13px;letter-spacing:.04em;margin-bottom:12px;color:var(--ink)}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-late{background:var(--late-bg);color:var(--late)}.b-na{background:#efece6;color:var(--na)}
.b-rose{background:var(--blush);color:var(--rose-dark)}
.b-anna{background:#ece4f3;color:#7c5e9e}.b-joice{background:var(--blush);color:var(--rose-dark)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.toolbar .f{display:flex;flex-direction:column;gap:3px}
.toolbar label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.toolbar select,.toolbar input{width:auto;min-width:120px;padding:7px 9px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px;background:var(--blush);border-radius:12px;line-height:1.7}
.empty b{color:var(--rose-dark)}
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--white)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tr:hover td{background:#fdfcf9}

/* ============================ DASHBOARD ============================ */
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:linear-gradient(120deg,var(--rose) 0%,var(--rose-soft) 100%);color:#fff;border-radius:var(--radius);padding:22px 26px;margin-bottom:20px}
.hero h2{font-size:19px;font-weight:600}
.hero .meta{font-size:12px;opacity:.92;margin-top:3px}
.hero .big{margin-left:auto;text-align:center;background:rgba(255,255,255,.16);border-radius:12px;padding:10px 22px}
.hero .big .n{font-size:26px;font-weight:700}.hero .big .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--na);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi.s-ok{border-left-color:var(--ok)}.kpi.s-warn{border-left-color:var(--warn)}.kpi.s-late{border-left-color:var(--late)}
.kpi .t{font-size:11.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);text-transform:uppercase}
.kpi .v{font-size:26px;font-weight:700;margin:4px 0 2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted)}
.kpi .m{font-size:11px;color:var(--muted);line-height:1.6}
.kpi .resp{font-size:10.5px;margin-top:6px}
.alert-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.alert-list li{list-style:none;display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.alert-list li:last-child{border-bottom:0}
.alert-list .d{margin-left:auto;white-space:nowrap}

/* ============================ CRONOGRAMA ============================ */
.seg{display:inline-flex;border:1.5px solid var(--rose);border-radius:10px;overflow:hidden}
.seg button{padding:7px 16px;font-weight:600;color:var(--rose-dark);font-size:12px}
.seg button.on{background:var(--rose);color:#fff}
.gantt{position:relative;overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px 0}
.g-row{display:flex;align-items:center;height:30px;position:relative}
.g-label{width:290px;min-width:290px;font-size:11.5px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:sticky;left:0;background:var(--white);z-index:2}
.g-track{position:relative;flex:1;height:100%;border-left:1px solid var(--line)}
.g-bar{position:absolute;top:7px;height:16px;border-radius:8px;background:var(--rose-pale);overflow:hidden;min-width:6px}
.g-bar .fill{height:100%;background:var(--rose)}
.g-bar.late{background:var(--late-bg);outline:1.5px solid var(--late)}
.g-bar.done{background:var(--ok-bg)}.g-bar.done .fill{background:var(--ok)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--rose-dark);z-index:1}
.g-today::after{content:'hoje';position:absolute;top:-2px;left:4px;font-size:9px;color:var(--rose-dark);font-weight:700}
.pct-cell{display:flex;align-items:center;gap:8px}
.pct-bar{flex:1;height:7px;background:var(--blush);border-radius:6px;min-width:60px;overflow:hidden}
.pct-bar .f{height:100%;background:var(--rose);border-radius:6px}

/* ============================ GRID COLEÇÃO ============================ */
.grid-wrap{overflow:auto;max-height:calc(100vh - 290px);background:var(--white);border:1px solid var(--line);border-radius:var(--radius)}
.cgrid{border-collapse:separate;border-spacing:0;min-width:1700px}
.cgrid th{position:sticky;top:0;z-index:5;background:var(--white);border-bottom:2px solid var(--line);font-size:9.5px;padding:6px;text-align:center;min-width:84px;vertical-align:bottom}
.cgrid th.fix,.cgrid td.fix{position:sticky;z-index:6;background:var(--white)}
.cgrid th.fix{z-index:8}
.cgrid .c1{left:0;min-width:34px}.cgrid .c2{left:34px;min-width:78px}.cgrid .c3{left:112px;min-width:108px;border-right:2px solid var(--line)}
.cgrid td{padding:3px;border-bottom:1px solid var(--line);text-align:center;font-size:10.5px}
.cgrid td.fix{text-align:left;font-size:11px;padding:3px 8px}
.cgrid .ref-code{font-weight:700}
.cgrid .ref-fam{font-size:9.5px;color:var(--muted)}
.cell{display:block;width:100%;border-radius:7px;padding:5px 2px;font-weight:600;font-size:10px;min-height:25px}
.cell.done{background:var(--ok-bg);color:var(--ok)}
.cell.donelate{background:var(--warn-bg);color:var(--warn)}
.cell.late{background:var(--late-bg);color:var(--late)}
.cell.pend{background:#f6f4ef;color:var(--na)}
.cell.na{background:repeating-linear-gradient(45deg,#f3f1ec 0 5px,#fbfaf7 5px 10px);color:transparent;cursor:default}
.cgrid .dl-chip{display:block;font-size:9px;color:var(--rose-dark);background:var(--blush);border-radius:6px;padding:2px 3px;margin-top:3px;font-weight:700}
.cgrid .cnt{font-size:9px;font-weight:700;line-height:1.5;display:block;margin-top:2px}
.cnt .g{color:var(--ok)}.cnt .r{color:var(--late)}.cnt .p{color:var(--na)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:10px 2px;font-size:11px;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* ============================ KANBAN ============================ */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kcol{background:var(--blush);border-radius:var(--radius);padding:12px;min-height:200px}
.kcol h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--rose-dark);margin-bottom:10px;display:flex;justify-content:space-between}
.kcard{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 5px rgba(26,26,26,.05)}
.kcard .ti{font-weight:600;font-size:12.5px;margin-bottom:5px}
.kcard .ms{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:10.5px;color:var(--muted)}
.kcard .acts{display:flex;gap:6px;margin-top:8px}
.kcard .acts button{font-size:10.5px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
.kcard .acts button:hover{border-color:var(--rose);color:var(--rose-dark)}
.kcard.late{border-left:4px solid var(--late)}

/* ============================ RITUAIS ============================ */
.rit-cad{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:18px}
.rit-cad .card{padding:13px 15px}
.rit-cad .freq{font-size:10.5px;color:var(--rose-dark);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.rit-cad .nm{font-weight:600;font-size:13px;margin:3px 0}
.rit-cad .ds{font-size:11px;color:var(--muted);line-height:1.55}
.rit-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--white);margin-bottom:9px}
.rit-item .ti{font-weight:600;font-size:13px}
.rit-item .ms{font-size:11px;color:var(--muted)}
.charge-item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.charge-item:last-child{border:0}

/* ============================ MANUAL DE USO ============================ */
.man-hero{background:linear-gradient(120deg,var(--rose) 0%,var(--rose-soft) 100%);color:#fff;border-radius:var(--radius);padding:26px 28px;margin-bottom:20px}
.man-hero h2{font-size:22px;font-weight:600;margin-bottom:6px}
.man-hero p{font-size:13px;opacity:.95;line-height:1.6;max-width:760px}
.man-wrap{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
.man-toc{position:sticky;top:78px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.man-toc h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.man-toc a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:500;margin-bottom:2px}
.man-toc a:hover{background:var(--blush);color:var(--rose-dark)}
.man-body{min-width:0}
.man-sec{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 26px;margin-bottom:18px;scroll-margin-top:80px}
.man-sec>h3{font-size:17px;color:var(--rose-dark);margin-bottom:4px;display:flex;align-items:center;gap:10px}
.man-sec>h3 .nicon{width:34px;height:34px;border-radius:9px;background:var(--blush);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.man-sec .lead{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.man-sec h4{font-size:13.5px;margin:18px 0 9px;color:var(--ink)}
.man-sec p{font-size:13px;line-height:1.7;margin-bottom:10px}
.man-sec ul{margin:0 0 12px 4px;list-style:none}
.man-sec ul li{font-size:13px;line-height:1.7;padding-left:20px;position:relative;margin-bottom:5px}
.man-sec ul li::before{content:'❀';color:var(--rose-soft);position:absolute;left:0;font-size:11px;top:3px}
.man-sec b{color:var(--ink)}
.steps{counter-reset:st;margin:6px 0 14px}
.step{position:relative;padding:12px 14px 12px 52px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px;background:#fdfcfa}
.step::before{counter-increment:st;content:counter(st);position:absolute;left:12px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--rose);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.step .st-t{font-weight:600;font-size:13px;margin-bottom:3px}
.step .st-d{font-size:12.5px;color:#555;line-height:1.6}
.callout{border-radius:11px;padding:12px 15px 12px 44px;position:relative;font-size:12.5px;line-height:1.6;margin:12px 0}
.callout::before{position:absolute;left:14px;top:11px;font-size:16px}
.callout.dica{background:var(--ok-bg);color:#2f5a40}.callout.dica::before{content:'💡'}
.callout.atencao{background:var(--warn-bg);color:#7a5a16}.callout.atencao::before{content:'⚠'}
.callout.ouro{background:var(--blush);color:var(--rose-dark);border:1px dashed var(--rose-soft)}.callout.ouro::before{content:'♔'}
.man-leg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.man-leg span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#555;background:#fbfaf7;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.man-leg .sw{width:13px;height:13px;border-radius:4px}
.faq{border-top:1px solid var(--line);padding:11px 0}
.faq:last-child{border-bottom:1px solid var(--line)}
.faq .q{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--ink)}
.faq .a{font-size:12.5px;color:#555;line-height:1.65}
.routine{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:8px 0 14px}
.routine .rc{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fdfcfa}
.routine .rc .cad{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--rose)}
.routine .rc .ti{font-weight:600;font-size:13px;margin:3px 0 8px}
.routine .rc ol{margin-left:16px;font-size:12px;line-height:1.65;color:#555}
@media(max-width:860px){.man-wrap{grid-template-columns:1fr}.man-toc{position:static;margin-bottom:8px}}

/* ============================ MODAL / TOAST / TOUR ============================ */
.modal{position:fixed;inset:0;background:rgba(26,26,26,.45);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:40px 16px;overflow:auto}
.modal.open{display:flex}
.modal-card{background:var(--white);border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(26,26,26,.25)}
.modal-card h3{font-size:15px;margin-bottom:4px}
.modal-card .sub{font-size:11.5px;color:var(--muted);margin-bottom:16px}
.frm{display:flex;flex-direction:column;gap:12px}

<body>
<div id="app"></div>
<div id="modal" class="modal" data-action="modal-bg"></div>
<div id="tour"></div>
<div id="toast"></div>
<input type="file" id="file-import" accept=".json" style="display:none">

<script src="data.js"></script>
<script>
'use strict';
/* =================================================================
   Liebe · Gestão de Coleção — protótipo single-file (PWR Gestão)
   data.js (seed) → STORE → SELECTORS → RENDER → ROUTER
   ================================================================= */

/* ---------------------------- helpers ---------------------------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>t==null?'':String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Math.random().toString(36).slice(2)+Date.now());
function hojeStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function agoraIso(){return new Date().toISOString()}
function diffDias(a,b){const[x,y,z]=a.split('-').map(Number),[p,q,r]=b.split('-').map(Number);return Math.round((Date.UTC(p,q-1,r)-Date.UTC(x,y-1,z))/864e5)}
function fmtBR(d){if(!d)return'—';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2)}
function fmtBRfull(d){if(!d)return'—';const p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function iniciais(n){return n.split(/\s+/).map(x=>x.replace(/[^\p{L}]/gu,'')).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._x);toast._x=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------------------------- store ---------------------------- */
const LS_DB='liebe_db', LS_SESS='liebe_session', LS_TOUR='liebe_tour_seen', LS_EXP='liebe_last_export', LS_SEEDDISMISS='liebe_seed_dismissed', LS_NAV='liebe_nav_collapsed';
let db=null;
/* ---------------------------- menu lateral (recolher/mostrar) ---------------------------- */
function isMobile(){return window.matchMedia('(max-width:860px)').matches}
let navCollapsed=(()=>{const s=localStorage.getItem(LS_NAV);return s===null?isMobile():s==='1'})();
function applyNav(){document.body.classList.toggle('nav-collapsed',navCollapsed)}
function setNav(v){navCollapsed=v;localStorage.setItem(LS_NAV,v?'1':'0');applyNav()}
let seedUpdate=false; // true quando o data.js traz uma planilha mais recente que a salva
const clone=o=>JSON.parse(JSON.stringify(o));
const MIGRATIONS=[]; // futuras migrações de schema (mesmo padrão no Supabase)
function migrate(d){let v=d.schema_version||1;while(v<MIGRATIONS.length+1){MIGRATIONS[v-1](d);v++;d.schema_version=v}return d}
function loadDb(){
  const seed=window.LIEBE_SEED;
  if(!seed){document.body.innerHTML='<div class="login-wrap"><div class="login-card"><p style="text-align:center">Erro: data.js não encontrado. Rode <b>python scripts/gerar_seed.py</b>.</p></div></div>';throw new Error('seed ausente')}
  let stored=null;
  try{const raw=localStorage.getItem(LS_DB);if(raw)stored=JSON.parse(raw)}catch(e){console.error('loadDb',e)}
  if(!stored){db=migrate(clone(seed));saveDbNow();return}
  db=migrate(stored);
  // A planilha (data.js) é mais nova que a versão salva neste navegador?
  const dismissed=Number(localStorage.getItem(LS_SEEDDISMISS)||0);
  if(seed.seed_version&&(db.seed_version||0)<seed.seed_version&&dismissed<seed.seed_version)seedUpdate=true;
}
// Aplica a nova planilha: substitui o catálogo (vindo do Excel) e PRESERVA o
// trabalho do dia a dia (tarefas, atas, cobranças, indicadores lançados).
function applyNewSeed(){
  const seed=window.LIEBE_SEED;
  ['users','collections','phases','phase_deadlines','macro_processes','references','reference_phases'].forEach(k=>db[k]=clone(seed[k]));
  db.seed_version=seed.seed_version;
  seedUpdate=false;localStorage.removeItem(LS_SEEDDISMISS);
  saveDbNow();render();toast('Coleção atualizada com a planilha mais recente ✓');
}
function dismissSeed(){seedUpdate=false;localStorage.setItem(LS_SEEDDISMISS,String(window.LIEBE_SEED.seed_version||0));render()}
let saveT=null;
function saveDb(){clearTimeout(saveT);saveT=setTimeout(saveDbNow,400)}
function saveDbNow(){try{localStorage.setItem(LS_DB,JSON.stringify(db))}catch(e){toast('⚠ Não foi possível salvar (armazenamento cheio). Exporte um backup!')}}
function commit(fn){if(!can('write')){toast('Seu perfil é somente leitura.');return}fn(db);saveDb();render()}

/* ---------------------------- sessão ---------------------------- */
function session(){try{return JSON.parse(localStorage.getItem(LS_SESS))}catch(e){return null}}
function currentUser(){const s=session();return s?db.users.find(u=>u.id===s.user_id):null}
function can(p){const u=currentUser();if(!u)return false;if(p==='write')return u.role!=='leitura';if(p==='admin')return u.role==='admin';return true}

/* ---------------------------- índices / seletores ---------------------------- */
const ix={};
function reindex(){
  ix.userById=Object.fromEntries(db.users.map(u=>[u.id,u]));
  ix.phaseById=Object.fromEntries(db.phases.map(p=>[p.id,p]));
  ix.refById=Object.fromEntries(db.references.map(r=>[r.id,r]));
  ix.dlByPhase={};db.phase_deadlines.forEach(d=>ix.dlByPhase[d.phase_id]=d.deadline_date);
  ix.rpByKey={};db.reference_phases.forEach(rp=>ix.rpByKey[rp.reference_id+'|'+rp.phase_id]=rp);
}
function phaseApplies(ref,ph){return ph.flow_type==='ambos'||ph.flow_type===ref.flow_type}
function statusProcesso(p,hoje){
  if(p.completed_at)return{k:'done',late:p.end_date&&p.completed_at>p.end_date}
  if(p.end_date&&p.end_date<hoje)return{k:'late',days:diffDias(p.end_date,hoje)}
  return{k:'ok'}
}
function statusCelula(ref,ph,hoje){
  if(!phaseApplies(ref,ph))return{k:'na'};
  const rp=ix.rpByKey[ref.id+'|'+ph.id], dl=ix.dlByPhase[ph.id];
  if(rp&&rp.completed_at)return{k:(dl&&rp.completed_at>dl)?'donelate':'done',date:rp.completed_at,rp};
  if(dl&&dl<hoje)return{k:'late',days:diffDias(dl,hoje)};
  return{k:'pend'};
}
function contadoresFase(refs,hoje){
  const out={};
  db.phases.forEach(ph=>{
    const c={done:0,late:0,pend:0,total:0};
    refs.forEach(r=>{const s=statusCelula(r,ph,hoje);if(s.k==='na')return;c.total++;
      if(s.k==='done'||s.k==='donelate')c.done++;else if(s.k==='late')c.late++;else c.pend++});
    out[ph.id]=c;
  });
  return out;
}
/* ---------------------------- KPIs ---------------------------- */
function kpis(){
  const hoje=hojeStr(),mes=hoje.slice(0,7);
  // % cumprimento do cronograma macro (processos vencidos concluídos no prazo)
  const vencidos=db.macro_processes.filter(p=>p.end_date&&p.end_date<hoje);
  const noPrazo=vencidos.filter(p=>p.completed_at&&p.completed_at<=p.end_date).length;
  const macro=vencidos.length?{v:Math.round(noPrazo/vencidos.length*100),n:noPrazo,d:vencidos.length}:null;
  // % peças no prazo (células: concluídas no prazo ÷ (concluídas + vencidas em aberto))
  let pOk=0,pTot=0;
  db.references.forEach(r=>db.phases.forEach(ph=>{const s=statusCelula(r,ph,hoje);
    if(s.k==='done'){pOk++;pTot++} else if(s.k==='donelate'||s.k==='late')pTot++}));
  const pecas=pTot?{v:Math.round(pOk/pTot*100),n:pOk,d:pTot}:null;
  // Tempo de Piloto (modelagem → pilotagem)
  const phMod=db.phases.find(p=>p.key==='modelagem'),phPil=db.phases.find(p=>p.key==='pilotagem');
  const tempos=[];
  if(phMod&&phPil)db.references.forEach(r=>{const a=ix.rpByKey[r.id+'|'+phMod.id],b=ix.rpByKey[r.id+'|'+phPil.id];
    if(a&&b&&a.completed_at&&b.completed_at)tempos.push(diffDias(a.completed_at,b.completed_at))});
  const piloto=tempos.length?{v:Math.round(tempos.reduce((s,x)=>s+x,0)/tempos.length),n:tempos.length}:null;
  // Atas em 24h
  const reunioes=db.rituals.filter(r=>r.scheduled_at&&r.scheduled_at.slice(0,10)<=hoje);
  const em24=reunioes.filter(r=>r.minutes_published_at&&(new Date(r.minutes_published_at)-new Date(r.scheduled_at))<=864e5).length;
  const atas=reunioes.length?{v:Math.round(em24/reunioes.length*100),n:em24,d:reunioes.length}:null;
  // manuais (mês corrente; senão, último lançado)
  const manual=k=>{const es=db.kpi_entries.filter(e=>e.kpi_key===k).sort((a,b)=>b.period.localeCompare(a.period));
    if(!es.length)return null;const e=es.find(x=>x.period===mes)||es[0];return{v:e.value,period:e.period}};
  return{macro,pecas,piloto,atas,rnc:manual('rnc'),otif:manual('otif_mp'),hoje};
}
function kpiClass(val,meta,alerta,inverso){
  if(val==null)return'';
  if(inverso)return val<=meta?'s-ok':'s-late';
  return val>=meta?'s-ok':(val>=alerta?'s-warn':'s-late');
}

/* ---------------------------- pauta automática ---------------------------- */
function gerarPauta(){
  const hoje=hojeStr();
  const atras=db.macro_processes.map(p=>({p,s:statusProcesso(p,hoje)})).filter(x=>x.s.k==='late')
    .sort((a,b)=>b.s.days-a.s.days);
  const cont=contadoresFase(db.references,hoje);
  const fasesCrit=db.phases.map(ph=>({ph,c:cont[ph.id]})).filter(x=>x.c.late>0).sort((a,b)=>b.c.late-a.c.late);
  const tVenc=db.tasks.filter(t=>t.status!=='concluida'&&t.status!=='cancelada'&&t.due_date&&t.due_date<hoje);
  const cobertas=db.charges.filter(c=>c.status==='aberta');
  let s='PAUTA — gerada automaticamente em '+fmtBRfull(hoje)+'\n\n';
  s+='1. CRONOGRAMA MACRO — processos em atraso ('+atras.length+')\n';
  atras.slice(0,10).forEach(x=>s+='   • '+x.p.name+' — '+x.s.days+' dias de atraso (prazo '+fmtBR(x.p.end_date)+')\n');
  if(!atras.length)s+='   • Nenhum processo em atraso ✔\n';
  s+='\n2. COLEÇÃO — fases com referências em atraso\n';
  fasesCrit.slice(0,6).forEach(x=>s+='   • '+x.ph.name+': '+x.c.late+' referência(s) em atraso\n');
  if(!fasesCrit.length)s+='   • Nenhuma fase com atraso ✔\n';
  s+='\n3. TAREFAS VENCIDAS ('+tVenc.length+')\n';
  tVenc.slice(0,8).forEach(t=>s+='   • '+t.title+' — '+(ix.userById[t.assignee_user_id]?.name||'?')+' (prazo '+fmtBR(t.due_date)+')\n');
  if(!tVenc.length)s+='   • Nenhuma ✔\n';
  s+='\n4. COBRANÇAS EM ABERTO ('+cobertas.length+')\n';
  cobertas.slice(0,8).forEach(c=>s+='   • '+(ix.userById[c.charged_user_id]?.name||'?')+': '+c.subject+'\n');
  if(!cobertas.length)s+='   • Nenhuma ✔\n';
  s+='\n5. Bloqueios e necessidades da equipe\n6. Distribuição de tarefas da semana\n';
  return s;
}

/* =================================================================
   ROUTER + SHELL
   ================================================================= */
const ROUTES={
  '#/dashboard':{t:'Painel de Indicadores',sub:'Metas, gatilhos e alertas do setor',ic:'◈',fn:vDashboard},
  '#/cronograma':{t:'Cronograma Macro',sub:'Os 35 processos da coleção',ic:'▤',fn:vCronograma},
  '#/colecao':{t:'Gestão da Coleção',sub:'Referências × fases de desenvolvimento',ic:'❀',fn:vColecao},
  '#/tarefas':{t:'Quadro de Tarefas',sub:'Encaminhamentos por pessoa — adeus, caderno',ic:'☰',fn:vTarefas},
  '#/rituais':{t:'Rituais & Atas',sub:'Reuniões, atas em 24h e cobranças documentadas',ic:'✎',fn:vRituais},
  '#/manual':{t:'Manual de Uso',sub:'Passo a passo de toda a plataforma',ic:'📖',fn:vManual},
};
const ST={colecao:{linha:'',familia:'',estilista:'',fluxo:'',status:'',busca:''},cronograma:{view:'lista'},tarefas:{pessoa:'',so_minhas:false}};

function render(){
  reindex();
  const u=currentUser();
  document.body.dataset.role=u?u.role:'';
  if(!u){$('#app').innerHTML=vLogin();return}
  let h=location.hash;if(!ROUTES[h]){h='#/dashboard';history.replaceState(null,'','#/dashboard')}
  const r=ROUTES[h];
  $('#app').innerHTML=`
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand"><button class="side-hide" data-action="nav-hide" title="Ocultar menu" aria-label="Ocultar menu">«</button><div class="brand">li<b>e</b>be</div><div class="brand-sub">gestão de coleção</div></div>
      <nav class="nav">${Object.entries(ROUTES).map(([k,v])=>`<a href="${k}" class="${k===h?'on':''}"><span class="ic">${v.ic}</span>${v.t}</a>`).join('')}</nav>
      <div class="regra-ouro"><b>Regra de Ouro</b>Prazo cobra-se com a <b style="display:inline">JOICE</b><br>Estilo cobra-se com a <b style="display:inline">ANNA</b></div>
      <div class="side-user">
        <div class="avatar">${iniciais(u.name)}</div>
        <div><div class="nm">${esc(u.name)}</div><div class="jt">${esc(u.job_title)}</div></div>
        <button data-action="logout">sair</button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="burger" data-action="burger" title="Mostrar/ocultar menu" aria-label="Mostrar ou ocultar menu">☰</button>
        <div><h1>${r.t}</h1><div class="sub">${r.sub}</div></div>
        <div class="sp"></div>
        ${h==='#/manual'?'':`<button class="btn btn-g btn-sm" data-action="tour">✦ Tour guiado</button>`}
        <a href="#/manual" class="btn btn-g btn-sm" ${h==='#/manual'?'style="display:none"':''}>📖 Manual</a>
        <button class="btn btn-g btn-sm" data-action="menu-dados">⛃ Dados</button>
      </div>
      ${seedUpdate?bannerSeed():''}
      <div class="content" id="page">${r.fn()}</div>
    </div>
  </div>`;
  applyNav();
  autoTour(h);
}

/* =================================================================
   VIEWS
   ================================================================= */
function vLogin(){
  const sel=vLogin._sel;
  return `<div class="login-wrap"><div class="login-card">
    <div class="brand">li<b>e</b>be</div>
    <div class="brand-sub">gestão de coleção · estilo & produto</div>
    <div class="login-note">Identificação para <b>registro de autoria</b> das atualizações — não é segurança de dados (protótipo de validação).<br>PIN padrão de todos: <b>1234</b></div>
    <div class="user-grid">${db.users.filter(u=>u.active).map(u=>`
      <button class="user-card ${sel===u.id?'sel':''}" data-action="pick-user" data-id="${u.id}">
        <div class="avatar">${iniciais(u.name)}</div>
        <div class="nm">${esc(u.name)}</div><div class="jt">${esc(u.job_title)}</div>
        <span class="role-chip">${u.role}</span>
      </button>`).join('')}
    </div>
    ${sel?`<div class="pin-row"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autofocus>
      <button class="btn btn-p" data-action="do-login">Entrar</button></div>`:''}
  </div></div>`;
}

/* ---------------------------- DASHBOARD ---------------------------- */
function vDashboard(){
  const k=kpis(),hoje=k.hoje;
  const col=db.collections.find(c=>c.id==='col-inverno-alto-27')||db.collections[0];
  const diasEntrega=col&&col.end_date?diffDias(hoje,col.end_date):null;
  const pctGeral=Math.round(db.macro_processes.reduce((s,p)=>s+(p.percent_complete||0),0)/(db.macro_processes.length||1));
  const atras=db.macro_processes.map(p=>({p,s:statusProcesso(p,hoje)})).filter(x=>x.s.k==='late').sort((a,b)=>b.s.days-a.s.days);
  const cont=contadoresFase(db.references,hoje);
  const fasesCrit=db.phases.map(ph=>({ph,c:cont[ph.id]})).filter(x=>x.c.late>0).sort((a,b)=>b.c.late-a.c.late);
  const tVenc=db.tasks.filter(t=>t.status!=='concluida'&&t.status!=='cancelada'&&t.due_date&&t.due_date<hoje);
  const cob=db.charges.filter(c=>c.status==='aberta');
  const card=(id,t,val,meta,resp,cls,extra)=>`
    <div class="kpi ${cls}" id="${id}">
      <div class="t">${t}</div>
      <div class="v">${val}</div>
      <div class="m">${meta}</div>
      <div class="resp"><span class="badge ${resp==='Anna'?'b-anna':'b-joice'}">${resp==='Anna'?'◆ Anna':'● Joice'}</span> ${extra||''}</div>
    </div>`;
  return `
  ${bannerBackup()}
  <div class="hero" id="hero-col">
    <div><h2>Coleção ${esc(col?col.name:'—')}</h2>
      <div class="meta">Início ${fmtBRfull(col?.start_date)} · Entrega do mostruário ${fmtBRfull(col?.end_date)} · ${db.references.length} referências (${db.references.filter(r=>r.flow_type==='nova').length} novas + ${db.references.filter(r=>r.flow_type==='continuado').length} continuadas)</div></div>
    <div class="big"><div class="n">${diasEntrega!=null?diasEntrega:'—'}</div><div class="l">dias p/ entrega</div></div>
    <div class="big"><div class="n">${pctGeral}%</div><div class="l">avanço médio macro</div></div>
  </div>
  <div class="kpi-grid" id="kpi-grid">
    ${card('kpi-macro','Cumprimento do Cronograma',k.macro?k.macro.v+'<small>%</small>':'<small>sem baseline</small>','Meta ≥ 95% · alerta &lt; 90% '+(k.macro?`· ${k.macro.n}/${k.macro.d} processos vencidos no prazo`:'· começa a medir nesta coleção'),'Joice',k.macro?kpiClass(k.macro.v,95,90):'')}
    ${card('kpi-pecas','Peças no Prazo por Fase',k.pecas?k.pecas.v+'<small>%</small>':'<small>sem baseline</small>','Meta ≥ 90% · alerta &lt; 85% '+(k.pecas?`· ${k.pecas.n}/${k.pecas.d} marcos no prazo`:''),'Joice',k.pecas?kpiClass(k.pecas.v,90,85):'')}
    ${card('kpi-piloto','Tempo de Piloto',k.piloto?k.piloto.v+'<small> dias</small>':'<small>sem baseline</small>','Meta: −20% na 1ª coleção pós-implantação '+(k.piloto?`· média de ${k.piloto.n} peças`:'· esta coleção é a linha de base'),'Anna')}
    ${card('kpi-atas','Atas em 24h',k.atas?k.atas.v+'<small>%</small>':'<small>sem reuniões</small>','Meta 100% '+(k.atas?`· ${k.atas.n}/${k.atas.d} reuniões`:'· registre as reuniões em Rituais & Atas'),'Joice',k.atas?kpiClass(k.atas.v,100,99):'')}
    ${card('kpi-rnc','RNCs do Setor (nº absoluto)',k.rnc&&k.rnc.v!=null?k.rnc.v:'<small>não medido</small>','Meta: −30% em 6 meses '+(k.rnc?'· ref. '+k.rnc.period:'· lance o valor mensal'),'Joice',k.rnc&&k.rnc.v!=null?(k.rnc.v===0?'s-ok':''):'')}
    ${card('kpi-otif','Atraso de MP (OTIF fornecedores)',k.otif&&k.otif.v!=null?k.otif.v+'<small>%</small>':'<small>não medido</small>','Meta ≥ 90% · alerta &lt; 80% → escalonar à Compras '+(k.otif?'· ref. '+k.otif.period:''),'Joice',k.otif&&k.otif.v!=null?kpiClass(k.otif.v,90,80):'')}

function vCronograma(){
  const hoje=hojeStr(),v=ST.cronograma.view;
  const ps=[...db.macro_processes].sort((a,b)=>a.seq-b.seq);
  const head=`<div class="toolbar">
    <div class="seg" id="cr-toggle"><button class="${v==='lista'?'on':''}" data-action="cr-view" data-v="lista">Lista</button><button class="${v==='gantt'?'on':''}" data-action="cr-view" data-v="gantt">Linha do tempo</button></div>
    <div style="flex:1"></div>
    <span class="badge b-ok">Em dia: ${ps.filter(p=>statusProcesso(p,hoje).k==='ok').length}</span>
    <span class="badge b-late">Em atraso: ${ps.filter(p=>statusProcesso(p,hoje).k==='late').length}</span>
    <span class="badge b-rose">Concluídos: ${ps.filter(p=>statusProcesso(p,hoje).k==='done').length}</span>
  </div>`;
  if(v==='gantt')return head+vGantt(ps,hoje);
  return head+`<div class="card" style="padding:0;overflow:auto" id="cr-tabela"><table>
    <thead><tr><th>#</th><th>Processo</th><th>Equipe</th><th>Início</th><th>Prazo</th><th style="min-width:130px">Avanço</th><th>Status</th><th class="w"></th></tr></thead>
    <tbody>${ps.map(p=>{const s=statusProcesso(p,hoje);
      const badge=s.k==='done'?`<span class="badge b-ok">Concluído${s.late?' c/ atraso':''} ${fmtBR(p.completed_at)}</span>`
        :s.k==='late'?`<span class="badge b-late">${s.days} dias em atraso</span>`:`<span class="badge b-ok">Em dia</span>`;
      return `<tr>
        <td>${p.seq}</td><td><b>${esc(p.name)}</b></td>
        <td>${p.owner_team?`<span class="badge b-rose">${esc(p.owner_team)}</span>`:'—'}</td>
        <td>${fmtBR(p.start_date)}</td><td>${fmtBR(p.end_date)}</td>
        <td><div class="pct-cell"><div class="pct-bar"><div class="f" style="width:${p.percent_complete||0}%"></div></div><b style="font-size:11px">${p.percent_complete||0}%</b></div></td>
        <td>${badge}</td>
        <td class="w"><button class="btn btn-g btn-sm" data-action="proc-edit" data-id="${p.id}">editar</button></td>
      </tr>`}).join('')}</tbody></table></div>`;
}
function vGantt(ps,hoje){
  const datas=ps.flatMap(p=>[p.start_date,p.end_date]).filter(Boolean).sort();
  if(!datas.length)return'<div class="empty">Sem datas no cronograma.</div>';
  const min=datas[0],max=datas[datas.length-1],span=Math.max(diffDias(min,max),1);
  const pos=d=>Math.min(100,Math.max(0,diffDias(min,d)/span*100));
  const tl=pos(hoje);
  return `<div class="gantt" id="cr-gantt">${ps.map(p=>{
    if(!p.start_date||!p.end_date)return`<div class="g-row"><div class="g-label">${p.seq}. ${esc(p.name)}</div><div class="g-track"></div></div>`;
    const s=statusProcesso(p,hoje),l=pos(p.start_date),w=Math.max(pos(p.end_date)-l,.6);
    return `<div class="g-row"><div class="g-label" title="${esc(p.name)}">${p.seq}. ${esc(p.name)}</div>
      <div class="g-track"><div class="g-today" style="left:${tl}%"></div>
      <div class="g-bar ${s.k==='late'?'late':s.k==='done'?'done':''}" style="left:${l}%;width:${w}%" title="${fmtBR(p.start_date)} → ${fmtBR(p.end_date)} · ${p.percent_complete||0}%"><div class="fill" style="width:${p.percent_complete||0}%"></div></div>
      </div></div>`}).join('')}</div>
  <div class="legend"><span><span class="sw" style="background:var(--rose)"></span>avanço</span><span><span class="sw" style="background:var(--rose-pale)"></span>planejado</span><span><span class="sw" style="background:var(--late-bg);outline:1.5px solid var(--late)"></span>em atraso</span><span><span class="sw" style="background:var(--ok-bg)"></span>concluído</span></div>`;
}

          <li><b>Equipe</b> (Anna, modelista, pilotistas, assistentes, PCP): atualiza fases, tarefas e participa das atas.</li>
          <li><b>Leitura</b> (Cairo, Eugênia): acompanham os painéis e relatórios, sem botões de edição.</li>
        </ul>
        <div class="callout dica">Use o menu lateral à esquerda para navegar entre as páginas. Ele fica sempre fixo na tela. No celular, toque no botão <b>☰</b> no topo para abri-lo.</div>
      </section>

      <section class="man-sec" id="s-rotina">
        <h3><span class="nicon">🗓️</span> 2. A rotina da Joice (o jeito mais fácil de usar)</h3>
        <div class="lead">Se você seguir esta rotina, a plataforma se mantém atualizada quase sozinha. Pense nela como a sua agenda de gestão.</div>
        <div class="routine">
          <div class="rc"><div class="cad">Todo dia · 15 min</div><div class="ti">Briefing matinal</div>
            <ol><li>Abra o <b>Painel</b> e veja os alertas do dia.</li><li>Confira o <b>Quadro de Tarefas</b> — cartões com borda rosé estão vencidos.</li><li>Alinhe rapidinho com a equipe o foco do dia.</li></ol></div>
          <div class="rc"><div class="cad">Toda segunda · 60 min</div><div class="ti">Ritual de cronograma</div>
            <ol><li>Em <b>Rituais & Atas</b>, clique em "registrar reunião" — a <b>pauta já vem pronta</b>.</li><li>Atualize o % dos processos no <b>Cronograma</b>.</li><li>Registre as conclusões de fases na <b>Coleção</b>.</li><li>Crie tarefas e cobranças do que foi decidido.</li><li>Escreva e <b>publique a ata em até 24h</b>.</li></ol></div>
          <div class="rc"><div class="cad">A cada 15 dias</div><div class="ti">Interfaces</div>
            <ol><li>Reunião com Compras, Qualidade, Engenharia e PCP.</li><li>Registre como reunião e anote encaminhamentos como tarefas.</li></ol></div>
          <div class="rc"><div class="cad">Todo mês</div><div class="ti">Indicadores & Diretoria</div>
            <ol><li>No Painel, clique em <b>"Lançar indicador do mês"</b> (RNCs e Atraso de MP).</li><li>Registre o reporte mensal à diretoria como reunião.</li><li>Exporte um backup e guarde no Drive.</li></ol></div>
        </div>
        <div class="callout ouro"><b>Regra de Ouro:</b> prazo cobra-se com a <b>Joice</b> · estilo/técnica cobra-se com a <b>Anna</b>. Cada decisão pertence a uma única cadeira. Ela fica sempre visível na lateral esquerda.</div>
      </section>

      <section class="man-sec" id="s-painel">
        <h3><span class="nicon">◈</span> 3. Painel de Indicadores</h3>
        <div class="lead">É a sua "tela do dia": em 30 segundos você sabe como o setor está.</div>
        <p>No topo, a faixa rosé mostra a coleção ativa, quantos <b>dias faltam para a entrega do mostruário</b> e o avanço médio do cronograma. Abaixo ficam os cartões de indicadores (KPIs), cada um com a <b>meta combinada</b>, o <b>gatilho de alerta</b> e o <b>responsável</b>.</p>
        <h4>Como ler as cores</h4>
        <div class="man-leg">
          <span><i class="sw" style="background:var(--ok)"></i> Verde: dentro da meta</span>
          <span><i class="sw" style="background:var(--warn)"></i> Âmbar: atenção</span>
          <span><i class="sw" style="background:var(--late)"></i> Rosé: alerta disparado</span>
          <span><i class="sw" style="background:var(--na)"></i> Cinza: sem baseline / não medido</span>
        </div>
        <p>Os cartões <b>cinza</b> ainda não têm histórico — esta coleção é a <b>linha de base</b>. Não é problema: é o ponto de partida para medir a evolução. Quatro indicadores o sistema <b>calcula sozinho</b> (cumprimento do cronograma, peças no prazo, tempo de piloto e atas em 24h). Dois você <b>lança uma vez por mês</b>:</p>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "＋ Lançar indicador do mês"</div><div class="st-d">Fica logo abaixo dos cartões.</div></div>
          <div class="step"><div class="st-t">Informe os RNCs e o Atraso de MP</div><div class="st-d"><b>RNCs</b> = número absoluto de não conformidades (não é %). <b>Atraso de MP</b> = OTIF dos fornecedores em %. Deixe em branco o que ainda não tiver.</div></div>
          <div class="step"><div class="st-t">Salve</div><div class="st-d">Os cartões assumem a cor certa automaticamente conforme a meta.</div></div>
        </div>
        <div class="callout dica">Os blocos de alerta embaixo (processos atrasados, fases críticas, pendências) são exatamente o que vira a <b>pauta da reunião de segunda</b> — você não precisa montar nada à mão.</div>
      </section>

      <section class="man-sec" id="s-cronograma">
        <h3><span class="nicon">▤</span> 4. Cronograma Macro</h3>
        <div class="lead">Os ${nProc} processos da coleção, do briefing inspiracional à produção das peças de catálogo.</div>
        <p>Há duas formas de ver, no botão no topo: <b>Lista</b> (para o dia a dia) e <b>Linha do tempo</b> (um Gantt que mostra a coleção inteira, com uma linha marcando "hoje"). O <b>status é calculado sozinho</b>: se um processo passou do prazo sem conclusão, aparece "X dias em atraso" — o sistema mostra o atraso, ninguém precisa apontar o dedo.</p>
        <h4>Atualizar um processo (faça na reunião de segunda)</h4>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "editar" na linha do processo</div><div class="st-d">Abre uma janelinha com os campos.</div></div>
          <div class="step"><div class="st-t">Ajuste o % de avanço</div><div class="st-d">Quanto daquele processo já foi feito.</div></div>
          <div class="step"><div class="st-t">Concluiu? Use "✓ Concluir hoje"</div><div class="st-d">Marca 100% e registra a data de conclusão de uma vez.</div></div>
          <div class="step"><div class="st-t">Precisou replanejar? Mude o prazo final</div><div class="st-d">A nova data fica registrada e o status se recalcula.</div></div>
        </div>
      </section>

      <section class="man-sec" id="s-colecao">
        <h3><span class="nicon">❀</span> 5. Gestão da Coleção</h3>
        <div class="lead">O coração do sistema: a grade de ${nRef} referências (linhas) × ${nFase} fases (colunas).</div>
        <p>Cada linha é uma peça/referência; cada coluna é uma fase do desenvolvimento (Desenho, Modelagem, Pilotagem… até Produção de Catálogo). O cabeçalho de cada fase mostra a <b>data-limite</b> e os contadores: <b>✓ no prazo</b>, <b>! em atraso</b> e <b>… pendentes</b>.</p>
        <h4>O que cada cor da célula significa</h4>
        <div class="man-leg">
          <span><i class="sw" style="background:var(--ok-bg)"></i> Concluída no prazo</span>
          <span><i class="sw" style="background:var(--warn-bg)"></i> Concluída com atraso</span>
          <span><i class="sw" style="background:var(--late-bg)"></i> Em atraso</span>
          <span><i class="sw" style="background:#f6f4ef"></i> Pendente</span>
          <span><i class="sw" style="background:repeating-linear-gradient(45deg,#f3f1ec 0 4px,#fbfaf7 4px 8px)"></i> Não se aplica</span>
        </div>
        <h4>Registrar a conclusão de uma fase</h4>
        <div class="steps">
          <div class="step"><div class="st-t">Clique na célula da referência × fase</div><div class="st-d">Ex.: a célula de "Modelagem" da referência 503151.</div></div>
          <div class="step"><div class="st-t">Informe a data de conclusão (e uma observação, se quiser)</div><div class="st-d">A data e <b>o seu nome</b> ficam gravados — é a evidência que substitui o caderno.</div></div>
          <div class="step"><div class="st-t">Salve</div><div class="st-d">A célula muda de cor e os contadores no topo se atualizam na hora.</div></div>
        </div>
        <h4>Filtrar e buscar</h4>
        <ul>
          <li>Filtre por <b>linha</b> (FASHION, LUXE…), <b>família</b> (KISS ME, LUMINA…), <b>estilista</b>, <b>fluxo</b> (coleção nova × continuados) ou só o que está <b>em atraso</b>.</li>
          <li>Use a busca para achar uma referência pelo código.</li>
        </ul>
        <div class="callout ouro">Os símbolos no cabeçalho indicam o dono do marco: <b>◆ (lilás)</b> = marco da <b>Anna</b> (técnico-criativo); <b>● (rosé)</b> = marco da <b>Joice</b> (prazo/processo). A cobrança certa vai para a cadeira certa.</div>
        <div class="callout atencao">A data-limite de cada fase pode ser editada pelo perfil de administração: clique no selo "limite…" no cabeçalho da coluna. Algumas fases ainda estão "sem limite" — defina-as para que o cálculo de atraso funcione nelas.</div>
      </section>

      <section class="man-sec" id="s-tarefas">
        <h3><span class="nicon">☰</span> 6. Quadro de Tarefas</h3>
        <div class="lead">O quadro que substitui o caderno: toda demanda vira um cartão com dono e prazo.</div>
        <p>São três colunas: <b>Pendente → Em andamento → Concluída</b>. Cartões com borda rosé estão com o prazo vencido.</p>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "＋ Nova tarefa"</div><div class="st-d">Saiu da reunião, virou cartão — na frente de todos.</div></div>
          <div class="step"><div class="st-t">Descreva, escolha o responsável e o prazo</div><div class="st-d">Pode adicionar detalhes opcionais.</div></div>
          <div class="step"><div class="st-t">Mova o cartão com ◀ e ▶</div><div class="st-d">Conforme a tarefa avança até "Concluída".</div></div>
        </div>
        <div class="callout dica">Marque <b>"só as minhas"</b> ou filtre por pessoa para ver a carga de cada um. Encaminhamento sem cartão é encaminhamento perdido.</div>
      </section>

      <section class="man-sec" id="s-rituais">
        <h3><span class="nicon">✎</span> 7. Rituais & Atas</h3>
        <div class="lead">As reuniões do setor, com pauta automática, atas em 24h e cobranças documentadas.</div>
        <p>No topo ficam os 4 rituais oficiais. Para registrar uma reunião:</p>
        <div class="steps">
          <div class="step"><div class="st-t">Clique em "＋ registrar reunião" no ritual desejado</div><div class="st-d">Ex.: o Ritual semanal de cronograma, toda segunda.</div></div>
          <div class="step"><div class="st-t">A pauta já vem pronta</div><div class="st-d">O sistema preenche com os atrasos do cronograma, fases críticas, tarefas vencidas e cobranças em aberto. Ajuste se quiser e registre.</div></div>
          <div class="step"><div class="st-t">Marque a presença e escreva a ata</div><div class="st-d">Anote decisões e encaminhamentos. Crie tarefas e cobranças direto da reunião.</div></div>
          <div class="step"><div class="st-t">Clique em "Publicar ata"</div><div class="st-d">O sistema cronometra: <b>ata publicada em até 24h</b> conta para a meta de 100%.</div></div>
        </div>
        <h4>Cobranças documentadas</h4>
        <p>Registre <b>quem</b> foi cobrado, <b>do quê</b>, <b>até quando</b> e com qual <b>evidência</b>. O registro tira a cobrança do campo pessoal — é o processo cobrando, não a pessoa. Não resolveu? O botão <b>"Escalar ↑"</b> leva o caso para a Diretoria de Estilo (na licença, para o Cairo).</p>
        <div class="callout ouro">Lembre-se: você (Joice) cobra <b>prazo</b>; a Anna cobra <b>estilo/técnica</b>. Registre na cadeira certa.</div>
      </section>

      <section class="man-sec" id="s-dados">
        <h3><span class="nicon">⛃</span> 8. Dados & Backup</h3>
        <div class="lead">Importante até a plataforma migrar para a nuvem (próxima fase do projeto).</div>
        <p>Por enquanto, os dados ficam salvos <b>neste navegador, neste computador</b>. Por isso a <b>máquina da Joice é a fonte oficial da verdade</b>. No botão <b>⛃ Dados</b> no topo você pode:</p>
        <ul>
          <li><b>Exportar backup (JSON)</b> — faça toda sexta e guarde no Drive. O sistema avisa com uma faixa quando o último backup tem mais de 7 dias.</li>
          <li><b>Exportar planilha (Excel)</b> — gera um arquivo .xlsx com a coleção, cronograma, tarefas e cobranças (útil para enviar à diretoria).</li>
          <li><b>Importar backup</b> — recupera os dados de um arquivo JSON (substitui os atuais, com confirmação).</li>
          <li><b>Restaurar dados originais</b> — volta tudo para a planilha original (use com cuidado).</li>
        </ul>
        <div class="callout atencao">Quando chega uma <b>versão mais recente da planilha</b>, aparece uma faixa verde no topo: clique em "Atualizar coleção". Isso troca o cronograma e a coleção pelos dados novos do Excel e <b>mantém</b> suas tarefas, atas e cobranças.</div>
      </section>

      <section class="man-sec" id="s-faq">
        <h3><span class="nicon">❓</span> 9. Perguntas frequentes</h3>
        <div class="faq"><div class="q">Errei uma data numa célula. Como corrijo?</div><div class="a">Clique na célula de novo e altere a data, ou use "Limpar registro" para deixá-la em branco.</div></div>
        <div class="faq"><div class="q">Por que algumas fases mostram "pendente" e não "em atraso"?</div><div class="a">Porque ainda não têm data-limite definida. O perfil de administração define o limite clicando no selo "sem limite" no cabeçalho da coluna.</div></div>
        <div class="faq"><div class="q">A equipe pode usar pelo celular?</div><div class="a">Sim. O layout se adapta; use o botão ☰ no topo para abrir o menu. Ideal para atualizar uma conclusão no chão de fábrica.</div></div>
        <div class="faq"><div class="q">O Cairo consegue editar sem querer?</div><div class="a">Não. O perfil dele é de leitura — os botões de edição nem aparecem.</div></div>
        <div class="faq"><div class="q">Perdi o que eu tinha feito. E agora?</div><div class="a">Se você exporta backup com frequência, é só usar "Importar backup". Por isso o hábito de exportar toda sexta é tão importante — até a versão na nuvem ficar pronta.</div></div>
        <div class="faq"><div class="q">Como reabro este manual?</div><div class="a">Pelo item <b>📖 Manual de Uso</b> no menu lateral, ou pelo botão <b>📖 Manual</b> no topo de qualquer página.</div></div>
      </section>

      <p style="text-align:center;color:var(--muted);font-size:11.5px;margin-top:6px">PWR Gestão · Sistema de Gestão de Cronograma da Liebe · uso interno</p>
    </div>
  </div>`;
}

function openModal(html){$('#modal').innerHTML=`<div class="modal-card">${html}</div>`;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML=''}
function selUsers(id,val,filtro){return `<select id="${id}">${db.users.filter(u=>u.active&&(!filtro||u.role!=='leitura')).map(u=>`<option value="${u.id}" ${val===u.id?'selected':''}>${esc(u.name)} — ${esc(u.job_title)}</option>`).join('')}</select>`}

function mCell(refId,phaseId){
  const r=ix.refById[refId],ph=ix.phaseById[phaseId],rp=ix.rpByKey[refId+'|'+phaseId],dl=ix.dlByPhase[phaseId];
  openModal(`
   <h3>${esc(ph.name)} · Ref. ${esc(r.code)}</h3>
   <div class="sub">${esc(r.family)} · ${esc(r.line)} · ${esc(r.stylist)} ${dl?`· data-limite ${fmtBRfull(dl)}`:''} · marco ${ph.marco_owner==='anna'?'da Anna (estilo)':'da Joice (prazo)'}</div>
   <div class="frm">
     <div><label>Data de conclusão</label><input type="date" id="m-data" value="${rp?rp.completed_at:hojeStr()}"></div>
     <div><label>Observação (opcional)</label><input id="m-obs" value="${esc(rp?.notes||'')}" placeholder="ex.: aprovada na 2ª prova"></div>
   </div>
   <div class="modal-acts">
     ${rp?`<button class="btn btn-g" data-action="cell-clear" data-ref="${refId}" data-phase="${phaseId}">Limpar registro</button>`:''}
     <button class="btn btn-g" data-action="modal-close">Cancelar</button>
     <button class="btn btn-p" data-action="cell-save" data-ref="${refId}" data-phase="${phaseId}">Salvar conclusão</button>
   </div>`);
}
function mProc(id){
  const p=db.macro_processes.find(x=>x.id===id);
  openModal(`
   <h3>${p.seq}. ${esc(p.name)}</h3>
   <div class="sub">Equipe: ${esc(p.owner_team||'—')} · planejado ${fmtBR(p.start_date)} → ${fmtBR(p.end_date)}</div>
   <div class="frm">
     <div class="frm-row">
       <div><label>% de avanço</label><input type="number" id="m-pct" min="0" max="100" value="${p.percent_complete||0}"></div>
       <div><label>Concluído em</label><input type="date" id="m-conc" value="${p.completed_at||''}"></div>
     </div>
     <div><label>Prazo final (replanejar)</label><input type="date" id="m-fim" value="${p.end_date||''}"></div>
   </div>
   <div class="modal-acts">
     <button class="btn btn-g" data-action="modal-close">Cancelar</button>
     <button class="btn btn-o" data-action="proc-done" data-id="${id}">✓ Concluir hoje</button>
     <button class="btn btn-p" data-action="proc-save" data-id="${id}">Salvar</button>
   </div>`);
}
function mTask(id){
  const t=id?db.tasks.find(x=>x.id===id):null;
  openModal(`
   <h3>${t?'Editar tarefa':'Nova tarefa'}</h3>
   <div class="sub">Todo encaminhamento vira cartão com dono e prazo — nada fica no caderno.</div>
   <div class="frm">
     <div><label>O que precisa ser feito</label><input id="m-ti" value="${esc(t?.title||'')}" placeholder="ex.: Cobrar renda importada do fornecedor X"></div>
     <div class="frm-row">
       <div><label>Responsável</label>${selUsers('m-resp',t?.assignee_user_id||currentUser().id,true)}</div>

   <div class="modal-acts">

     <button class="btn btn-g" data-action="modal-close">Cancelar</button>
     <button class="btn btn-p" data-action="task-save" data-id="${id||''}">Salvar</button>
   </div>`);
}

   </div>
   <div class="modal-acts" style="flex-wrap:wrap">

     <button class="btn btn-o w" data-action="rit-task" data-rit="${id}">＋ tarefa</button>
     <span style="flex:1"></span>

function mCharge(ritId){

/* ---------------------------- export Excel (SheetJS lazy + fallback CSV) ---------------------------- */
function gridLinhas(){
  const hoje=hojeStr();
  const head=['#','COLEÇÃO','LINHA','FAMÍLIA','ESTILISTA','REFERÊNCIA','FLUXO',...db.phases.map(p=>p.name)];
  const rows=db.references.map((r,i)=>[i+1,r.collection_name,r.line,r.family,r.stylist,r.code,r.flow_type,
    ...db.phases.map(ph=>{const s=statusCelula(r,ph,hoje);
      return s.k==='na'?'N/A':s.k==='done'||s.k==='donelate'?s.date:s.k==='late'?s.days+' dias em atraso':''})]);
  return[head,...rows];
}
function exportExcel(){
  const fim=()=>{localStorage.setItem(LS_EXP,agoraIso());render()};
  const run=()=>{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(gridLinhas()),'Gestão da Coleção');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['#','Processo','Equipe','Início','Prazo','% Avanço','Concluído em'],
      ...db.macro_processes.map(p=>[p.seq,p.name,p.owner_team||'',p.start_date||'',p.end_date||'',(p.percent_complete||0)+'%',p.completed_at||''])]),'Cronograma');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Tarefa','Responsável','Prazo','Status','Detalhes'],
      ...db.tasks.map(t=>[t.title,ix.userById[t.assignee_user_id]?.name||'',t.due_date||'',t.status,t.description||''])]),'Tarefas');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Cobrado','Por','Assunto','Prazo','Evidência','Status'],
      ...db.charges.map(c=>[ix.userById[c.charged_user_id]?.name||'',ix.userById[c.charged_by]?.name||'',c.subject,c.due_date||'',c.evidence||'',c.status])]),'Cobranças');
    XLSX.writeFile(wb,'liebe-gestao-colecao-'+hojeStr()+'.xlsx');toast('Excel exportado.');fim();
  };
  if(window.XLSX){run();return}
  toast('Carregando exportador…');
  const s=document.createElement('script');
  s.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
  s.onload=run;
  s.onerror=()=>{ // sem internet: CSV
    const csv=gridLinhas().map(l=>l.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    baixar(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),'liebe-gestao-colecao-'+hojeStr()+'.csv');
    toast('Sem internet — exportado em CSV.');fim();
  };
  document.head.appendChild(s);
}
$('#file-import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const nd=JSON.parse(rd.result);
    if(!nd.references||!nd.phases){toast('Arquivo inválido.');return}
    if(!confirm(`Importar backup de ${nd.exported_at?new Date(nd.exported_at).toLocaleString('pt-BR'):'?'} — ${nd.references.length} referências, ${nd.tasks.length} tarefas, ${nd.rituals.length} reuniões?\nIsto SUBSTITUI os dados atuais.`))return;
    delete nd.exported_at;db=migrate(nd);saveDbNow();closeModal();render();toast('Backup importado ✓');
  }catch(err){toast('Erro ao ler o arquivo.')}};
  rd.readAsText(f);e.target.value='';
});

let tourState=null;
function startTour(route){
  const steps=TOURS[route];if(!steps||!steps.length)return;
  tourState={steps,i:0,route};
  $('#tour').classList.add('open');
  $('#tour').innerHTML='<div class="tour-spot"></div><div class="tour-tip"></div>';
  tourStep(0);
}
function tourStep(i){
  const st=tourState;if(!st)return;
  if(i<0)i=0;
  if(i>=st.steps.length){endTour();return}
  st.i=i;
  const s=st.steps[i];
  let el=null;
  for(const sel of s.el.split(',')){el=document.querySelector(sel.trim());if(el)break}
  if(!el){tourStep(i+1);return}
  el.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{
    const r=el.getBoundingClientRect();
    const spot=$('#tour .tour-spot'),tip=$('#tour .tour-tip');
    spot.style.cssText=`left:${r.left-8}px;top:${r.top-8}px;width:${r.width+16}px;height:${r.height+16}px;border-radius:14px;box-shadow:0 0 0 9999px rgba(26,26,26,.55)`;
    tip.innerHTML=`<h4>${s.t}</h4><p>${s.p}</p>
      <div class="ta"><span class="step-n">${i+1} de ${st.steps.length}</span>
      ${i>0?'<button class="btn btn-g btn-sm" data-action="tour-prev">← anterior</button>':''}
      <button class="btn btn-p btn-sm" data-action="tour-next">${i===st.steps.length-1?'Concluir ✓':'próximo →'}</button>
      <button class="btn btn-g btn-sm" data-action="tour-end">fechar</button></div>`;
    const tw=340,th=tip.offsetHeight||180,vw=innerWidth,vh=innerHeight;
    let tx=r.left,ty=r.bottom+14;
    if(ty+th>vh-20)ty=Math.max(16,r.top-th-14);
    if(tx+tw>vw-16)tx=Math.max(16,vw-tw-16);
    tip.style.cssText=`left:${tx}px;top:${ty}px`;
  },330);
}
function endTour(){
  if(tourState){const seen=JSON.parse(localStorage.getItem(LS_TOUR)||'{}');seen[tourState.route]=true;localStorage.setItem(LS_TOUR,JSON.stringify(seen))}
  tourState=null;$('#tour').classList.remove('open');$('#tour').innerHTML='';
}
ACTIONS['tour-next']=()=>tourStep(tourState.i+1);
ACTIONS['tour-prev']=()=>tourStep(tourState.i-1);
ACTIONS['tour-end']=()=>endTour();
function autoTour(route){
  if(!TOURS[route])return;
  const seen=JSON.parse(localStorage.getItem(LS_TOUR)||'{}');
  if(seen[route])return;
  setTimeout(()=>startTour(route),650);
}

});
document.addEventListener('input',e=>{
  if(e.target.dataset.filter==='busca'){clearTimeout(vColecao._t);vColecao._t=setTimeout(()=>{ST.colecao.busca=e.target.value;const sc=$('#col-grid')?.scrollLeft;render();const g=$('#col-grid');if(g&&sc)g.scrollLeft=sc;const inp=document.querySelector('[data-filter="busca"]');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}},350)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();endTour()}
  if(e.key==='Enter'&&$('#pin')&&document.activeElement===$('#pin'))ACTIONS['do-login']();
});
window.addEventListener('hashchange',()=>{if(isMobile())setNav(true);render()});
window.addEventListener('resize',()=>{if(tourState)tourStep(tourState.i)});

/* ---------------------------- init ---------------------------- */
loadDb();
render();
</script>
</body>
</html>
